<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HKBU Li Promenade AR Guide</title>
    
    <!-- QR Code Scanner Library -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <style>
        /* ==================== BASE STYLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }
        
        /* ==================== CAMERA LAYER ==================== */
        #camera-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            background: #000;
        }
        
        #qr-canvas {
            display: none;
        }
        
        /* ==================== UI LAYERS ==================== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
        }
        
        .hidden {
            display: none !important;
        }
        
        /* ==================== NAVIGATION ARROW (ISSUE 2 FIXED) ==================== */
        #arrow-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            display: none;
            pointer-events: none;
            animation: arrowPulse 2s ease-in-out infinite;
        }
        
        #navigation-arrow {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 0% 70%, 30% 70%, 30% 100%, 70% 100%, 70% 70%, 100% 70%);
            /* FIXED: Removed CSS transition to prevent afterimages, added hardware acceleration */
            will-change: transform;
        }
        
        @keyframes arrowPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }
        
        /* ==================== STATUS PANEL ==================== */
        #status-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(10px);
            color: white;
            padding: 25px 20px;
            z-index: 20;
            transition: transform 0.3s ease;
        }
        
        #checkpoint-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }
        
        #distance-display {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        #instruction-text {
            font-size: 15px;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.5;
            color: #CCCCCC;
            white-space: pre-line;
        }
        
        #main-action-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 15px 30px;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #main-action-btn:active {
            transform: scale(0.98);
        }
        
        /* ==================== WELCOME SCREEN ==================== */
        #welcome-screen {
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            text-align: center;
            padding: 40px 30px;
        }
        
        #welcome-screen h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        #welcome-screen p {
            color: white;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            white-space: pre-line;
        }
        
        #start-game-btn {
            padding: 18px 40px;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* ==================== VIDEO PLAYER ==================== */
        #video-overlay {
            flex-direction: column;
            background: #000;
            padding-top: 0px;
            padding-left: 0px;
            position: relative;
        }
        
        #game-video {
            width: 100%;
            max-width: 356px;
            max-height: 650px;
        }
        
        #video-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
        }
        
        #skip-video-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        
        /* ==================== QR SCANNER ==================== */
        #scanner-overlay {
            background: transparent;
        }
        
        #scanner-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #scanner-frame {
            position: absolute;
            width: 280px;
            height: 280px;
            top: 107px;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid #00ffff;
            border-radius: 20px;
            background: transparent;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.8), 0 0 16px #00ffff;
            transition: border-color 0.3s ease;
            z-index: 10;
        }
        
        #scanner-frame::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border: 3px solid #00FFFF;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: scanPulse 2s infinite;
        }
        
        @keyframes scanPulse {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        #scanner-instruction {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            font-size: 18px;
            line-height: 1.5;
            text-align: center;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            z-index: 11;
        }
        
        #cancel-scan-btn {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 11;
        }
        
        /* ==================== QUIZ PANEL ==================== */
        #question-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            background: rgba(0, 0, 0, 0.95);
        }
        
        #question-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #quiz-panel-background {
            position: absolute;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            width: 251px;
            height: 222px;
            background-image: url('quiz-panel.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: transparent;
            image-rendering: pixelated;
            z-index: 10;
        }
        
        #question-text {
            position: absolute;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            text-align: left;
            width: 180px;
            font-weight: bold;
            line-height: 1.4;
            color: #333;
            text-shadow: 0 1px 2px rgba(255,255,255,0.7);
            margin-top: 40px;
            margin-left: 30px;
            z-index: 12;
        }
        
        #answer-buttons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .answer-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            width: 280px;
            height: 55px;
            font-size: 17px;
            padding: 0;
            border: none;
            cursor: pointer;
            background-image: url('button-blue.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: transparent;
            image-rendering: pixelated;
            color: #333;
            font-weight: bold;
            text-shadow: 0 1px 1px rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        
        .answer-btn:active {
            transform: translateX(-50%) scale(0.98);
        }
        
        .answer-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translateX(-50%);
        }
        
        .answer-btn:nth-child(1) { top: 300px; }
        .answer-btn:nth-child(2) { top: 360px; }
        .answer-btn:nth-child(3) { top: 420px; }
        .answer-btn:nth-child(4) { top: 480px; }
        
        #feedback {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 300px;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.5;
            text-align: center;
            z-index: 20;
        }
        
        #continue-btn {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            z-index: 21;
            display: none;
            transition: all 0.3s ease;
        }
        
        #continue-btn:active {
            transform: translateX(-50%) scale(0.98);
        }
        
        /* ==================== DEBUG PANEL ==================== */
        #debug-compass {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #00FF00;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            z-index: 9999;
            display: none;
            border: 2px solid #00FF00;
            min-width: 200px;
        }
        
        #debug-compass div {
            margin: 4px 0;
        }
        
        #debug-compass span {
            color: #00FFFF;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <!-- ================================================================= -->
    <!--                    UNITY-STYLE INSPECTOR                          -->
    <!-- ================================================================= -->
    <script>

                    correctAnswerIndex: 1,

                    arrivalMessage: "You've reached the Student Center!"
                },
                {
                    name: "Academic Building",
                    qrCode: "HKBU_CP3", 
                    lat: 22.3380, // UPDATE: Stand at Academic Building, get GPS coordinates
                    lng: 114.1815, // UPDATE: Stand at Academic Building, get GPS coordinates
                    fallbackBearing: 270,
                    fallbackDistance: 35,
                    question: "Which school is HKBU particularly well-known for?",
                    answers: ["School of Medicine", "School of Communication", "School of Law", "School of Agriculture"],
                    correctAnswerIndex: 1,
                    hint: "HKBU has a strong reputation in media and journalism programs.",
                    arrivalMessage: "Welcome to the Academic Building!"
                }
            ]
        };
    </script>
    
    <!-- Camera Stream Background -->
    <video id="camera-view" autoplay muted playsinline></video>
    <canvas id="qr-canvas"></canvas>
    
    <!-- Navigation Arrow -->
    <div id="arrow-container">
        <div id="navigation-arrow"></div>
    </div>
    
    <!-- Status Panel -->
    <div id="status-panel" class="hidden">
        <div id="checkpoint-name"></div>
        <div id="distance-display"></div>
        <div id="instruction-text"></div>
        <button id="main-action-btn"></button>
    </div>
    
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="overlay">
        <div>
            <h1 id="welcome-title"></h1>
            <p id="welcome-message"></p>
            <button id="start-game-btn" onclick="startGame()">Start Adventure</button>
        </div>
    </div>
    
    <!-- Video Player -->
    <div id="video-overlay" class="overlay hidden">
        <video id="game-video" controls playsinline>
            <source id="video-source" src="" type="video/mp4">
        </video>
        <div id="video-controls">
            <button id="skip-video-btn" onclick="skipVideo()"></button>
        </div>
    </div>
    
    <!-- QR Scanner Overlay -->
    <div id="scanner-overlay" class="overlay hidden">
        <div id="scanner-container">
            <div id="scanner-frame"></div>
            <p id="scanner-instruction"></p>
            <button id="cancel-scan-btn" onclick="cancelScanning()">Cancel</button>
        </div>
    </div>
    
    <!-- Question Overlay -->
    <div id="question-overlay" class="overlay hidden">
        <div id="question-container">
            <div id="quiz-panel-background"></div>
            <h2 id="question-text"></h2>
            <div id="answer-buttons"></div>
            <div id="feedback"></div>
            <button id="continue-btn" onclick="continueToNextCheckpoint()">Continue</button>
        </div>
    </div>
    
    <!-- Debug Panel -->
    <div id="debug-compass">
        <div> Navigation Debug</div>
        <div>Heading: <span id="debug-heading">0</span>°</div>
        <div>GPS Dist: <span id="debug-dist">-</span>m</div>
        <div>Target Brg: <span id="debug-target">-</span>°</div>
        <div>Arrow Rot: <span id="debug-rotation">0</span>°</div>
        <div>GPS Status: <span id="debug-gps">off</span></div>
    </div>

    <script>
        // ============================================
        // GAME STATE VARIABLES
        // ============================================
        let gameState = 'welcome';
        let currentCheckpointIndex = 0;
        let deviceHeading = 0;
        let smoothedHeading = 0; // For smooth rendering
        let isOriginSet = false;
        let videoStream = null;
        let scanningInterval = null;
        let isScanning = false;
        let animationFrameId = null;
        
        // GPS Navigation State (ISSUE 3 SOLUTION)
        let currentLat = null;
        let currentLng = null;
        let watchPositionId = null;
        let currentDistance = 0;
        let currentBearing = 0;
        let hasGPSSignal = false;

        // ============================================
        // GPS HELPER FUNCTIONS (ISSUE 3 SOLUTION)
        // ============================================
        
        // Haversine formula for accurate distance calculation
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Earth radius in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Calculate bearing from current position to target
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const λ1 = lon1 * Math.PI / 180;
            const λ2 = lon2 * Math.PI / 180;

            const y = Math.sin(λ2 - λ1) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) -
                      Math.sin(φ1) * Math.cos(φ2) * Math.cos(λ2 - λ1);
            const θ = Math.atan2(y, x);
            return (θ * 180 / Math.PI + 360) % 360;
        }

        function startGPSTracking() {
            if (!GAME_CONFIG.behavior.useGPS || !navigator.geolocation) {
                console.log('GPS disabled or unavailable, using fallback navigation');
                return;
            }

            watchPositionId = navigator.geolocation.watchPosition(
                (position) => {
                    hasGPSSignal = true;
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    
                    // Update navigation if we're currently navigating
                    if (gameState === 'navigating' && currentCheckpointIndex < GAME_CONFIG.checkpoints.length) {
                        const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                        currentDistance = Math.round(calculateDistance(currentLat, currentLng, checkpoint.lat, checkpoint.lng));
                        currentBearing = calculateBearing(currentLat, currentLng, checkpoint.lat, checkpoint.lng);
                        
                        // Update distance display
                        if (GAME_CONFIG.behavior.showDistance) {
                            document.getElementById('distance-display').textContent = `${currentDistance}m away`;
                        }
                    }
                    
                    document.getElementById('debug-gps').textContent = 'active';
                },
                (error) => {
                    console.warn('GPS Error:', error.message);
                    hasGPSSignal = false;
                    document.getElementById('debug-gps').textContent = 'error';
                },
                {
                    enableHighAccuracy: GAME_CONFIG.behavior.gpsHighAccuracy,
                    maximumAge: GAME_CONFIG.behavior.gpsMaxAge,
                    timeout: GAME_CONFIG.behavior.gpsTimeout
                }
            );
        }

        function stopGPSTracking() {
            if (watchPositionId && navigator.geolocation) {
                navigator.geolocation.clearWatch(watchPositionId);
                watchPositionId = null;
                hasGPSSignal = false;
            }
        }
        
        // ============================================
        // CAMERA LIFECYCLE MANAGEMENT (ISSUE 1 SOLUTION)
        // ============================================
        
        async function startCameraStream() {
            try {
                // Stop existing stream if present
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                    videoStream = null;
                }

                // Request new camera stream
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                const videoElement = document.getElementById('camera-view');
                videoElement.srcObject = videoStream;

                // Wait for video to load
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        videoElement.play().catch(e => console.log('Video play prevented:', e));
                        resolve();
                    };
                });

                console.log('✅ Camera stream started successfully');
            } catch (error) {
                console.error('❌ Camera start error:', error);
                alert('Unable to access camera. Please check permissions and try again.');
            }
        }

        function stopCameraStream() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => {
                    track.stop();
                    console.log('🔴 Camera track stopped');
                });
                videoStream = null;
            }
        }

        // ISSUE 1 SOLUTION: Handle iOS Safari camera blackout recovery
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                console.log('📱 App resumed, restarting camera...');
                if (gameState !== 'welcome') {
                    await startCameraStream();
                    // Re-bind orientation listeners (iOS sometimes drops them)
                    window.addEventListener('deviceorientation', handleOrientationChange, true);
                    window.addEventListener('deviceorientationabsolute', handleOrientationChange, true);
                }
            } else {
                console.log('📱 App backgrounded, stopping camera to save battery');
                stopCameraStream();
            }
        });

        // Additional iOS Safari recovery
        window.addEventListener('pageshow', async (event) => {
            if (event.persisted || document.visibilityState === 'visible') {
                console.log('📱 Page restored from cache, restarting camera...');
                if (gameState !== 'welcome') {
                    await startCameraStream();
                }
            }
        });

        // ============================================
        // INITIALIZATION AND CONFIGURATION
        // ============================================
        function applyConfiguration() {
            const config = GAME_CONFIG;
            const arrow = document.getElementById('navigation-arrow');
            const arrowContainer = document.getElementById('arrow-container');
            
            arrow.style.background = `linear-gradient(135deg, ${config.appearance.arrowColor} 0%, ${config.appearance.arrowColor}DD 100%)`;
            arrow.style.filter = `drop-shadow(0 0 ${config.appearance.arrowGlowIntensity}px ${config.appearance.arrowColor})`;
            arrowContainer.style.width = config.appearance.arrowSize + 'px';
            arrowContainer.style.height = config.appearance.arrowSize + 'px';
            
            document.getElementById('status-panel').style.borderTopColor = config.appearance.primaryColor;
            document.getElementById('checkpoint-name').style.color = config.appearance.primaryColor;
            
            document.getElementById('welcome-title').textContent = config.general.welcomeTitle;
            document.getElementById('welcome-title').style.color = config.appearance.primaryColor;
            document.getElementById('welcome-message').textContent = config.general.welcomeMessage;
            
            const startBtn = document.getElementById('start-game-btn');
            const actionBtn = document.getElementById('main-action-btn');
            
            startBtn.style.background = `linear-gradient(135deg, ${config.appearance.buttonColor} 0%, ${config.appearance.buttonColor}DD 100%)`;
            startBtn.style.boxShadow = `0 6px 20px ${config.appearance.buttonColor}80`;
            
            actionBtn.style.background = `linear-gradient(135deg, ${config.appearance.buttonColor} 0%, ${config.appearance.buttonColor}DD 100%)`;
            actionBtn.style.boxShadow = `0 4px 15px ${config.appearance.buttonColor}66`;
            
            document.getElementById('skip-video-btn').textContent = config.video.skipButtonText;
            if (!config.video.showSkipButton) {
                document.getElementById('skip-video-btn').style.display = 'none';
            }
        }
        
        async function startGame() {
            try {
                // Request iOS compass permission
                if (typeof DeviceOrientationEvent !== 'undefined' && 
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('🧭 Compass permission is REQUIRED for navigation!');
                        return;
                    }
                }
                
                // Bind compass event listeners
                window.addEventListener('deviceorientation', handleOrientationChange, true);
                window.addEventListener('deviceorientationabsolute', handleOrientationChange, true);
                
                // Start camera and GPS
                await startCameraStream();
                startGPSTracking();
                
                // Start smooth render loop (ISSUE 2 SOLUTION)
                startRenderLoop();
                
                hideOverlay('welcome-screen');
                
                if (GAME_CONFIG.video.enableIntroVideo) {
                    playIntroVideo();
                } else {
                    promptOriginScan();
                }
                
            } catch (error) {
                console.error('Startup error:', error);
                alert('Unable to start game. Please allow camera and motion permissions.');
            }
        }
        
        // ============================================
        // VIDEO SYSTEM
        // ============================================
        function playIntroVideo() {
            gameState = 'introVideo';
            const videoElement = document.getElementById('game-video');
            const videoSource = document.getElementById('video-source');
            videoSource.src = GAME_CONFIG.video.introVideoPath;
            videoElement.load();
            if (GAME_CONFIG.video.autoPlayVideos) {
                videoElement.play().catch(err => console.log('Autoplay prevented'));
            }
            videoElement.onended = () => {
                hideOverlay('video-overlay');
                promptOriginScan();
            };
            showOverlay('video-overlay');
        }
        
        function skipVideo() {
            const videoElement = document.getElementById('game-video');
            videoElement.pause();
            hideOverlay('video-overlay');
            if (gameState === 'introVideo') promptOriginScan();
            else if (gameState === 'outroVideo') gameComplete();
        }
        
        // ============================================
        // COMPASS & SMOOTH RENDER LOOP (ISSUE 2 SOLUTION)
        // ============================================
        
        function handleOrientationChange(event) {
            let newHeading = null;
            
            if (event.webkitCompassHeading !== undefined) {
                // iOS Safari (0° = North, clockwise)
                newHeading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                // Standard web (0° = North, counterclockwise from North)
                newHeading = 360 - event.alpha;
            }
            
            if (newHeading !== null) {
                deviceHeading = newHeading;
            }
        }

        // ISSUE 2 SOLUTION: Smooth render loop using requestAnimationFrame
        function startRenderLoop() {
            function render() {
                // Smooth heading interpolation to prevent jitter
                let headingDiff = deviceHeading - smoothedHeading;
                
                // Handle 360° wraparound
                if (headingDiff > 180) headingDiff -= 360;
                if (headingDiff < -180) headingDiff += 360;
                
                // Apply smoothing
                smoothedHeading += headingDiff * GAME_CONFIG.behavior.arrowSmoothness;
                
                // Normalize to 0-360°
                if (smoothedHeading < 0) smoothedHeading += 360;
                if (smoothedHeading >= 360) smoothedHeading -= 360;

                // Update navigation arrow if we're navigating
                if (gameState === 'navigating' && currentCheckpointIndex < GAME_CONFIG.checkpoints.length) {
                    updateNavigationArrow();
                }
                
                // Continue render loop
                animationFrameId = requestAnimationFrame(render);
            }
            
            render();
        }

        function updateNavigationArrow() {
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            
            // ISSUE 3 SOLUTION: Use GPS bearing if available, otherwise fallback to static bearing
            let targetBearing;
            if (hasGPSSignal && GAME_CONFIG.behavior.useGPS) {
                targetBearing = currentBearing;
            } else {
                targetBearing = checkpoint.fallbackBearing;
            }
            
            // Calculate arrow rotation
            let rotation = targetBearing - smoothedHeading;
            
            // Normalize rotation to ±180°
            while (rotation > 180) rotation -= 360;
            while (rotation < -180) rotation += 360;
            
            // Apply rotation to arrow (synced with display refresh rate)
            const arrow = document.getElementById('navigation-arrow');
            arrow.style.transform = `rotate(${rotation}deg)`;
            
            // Update debug display
            updateDebugDisplay(targetBearing, rotation);
        }

        function updateDebugDisplay(targetBearing, rotation) {
            if (GAME_CONFIG.behavior.showDebugPanel) {
                document.getElementById('debug-heading').textContent = Math.round(smoothedHeading);
                document.getElementById('debug-target').textContent = Math.round(targetBearing);
                document.getElementById('debug-rotation').textContent = Math.round(rotation);
                document.getElementById('debug-dist').textContent = hasGPSSignal ? currentDistance : '-';
            }
        }
        
        // ============================================
        // QR SCANNING SYSTEM
        // ============================================
        function startQRScanning() {
            if (isScanning) return;
            isScanning = true;
            hideStatusPanel();
            showOverlay('scanner-overlay');
            resetScannerAppearance();
            
            if (gameState === 'scanOrigin') {
                document.getElementById('scanner-instruction').textContent = 'Scan the ORIGIN QR code';
            } else if (gameState === 'scanCheckpoint') {
                const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                document.getElementById('scanner-instruction').textContent = `Scan QR for: ${checkpoint.name}`;
            }
            scanningInterval = setInterval(scanForQRCode, GAME_CONFIG.behavior.qrScanInterval);
        }
        
        function scanForQRCode() {
            const video = document.getElementById('camera-view');
            const canvas = document.getElementById('qr-canvas');
            const context = canvas.getContext('2d');
            
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            try {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const qrCode = jsQR(imageData.data, imageData.width, imageData.height, { 
                    inversionAttempts: "dontInvert" 
                });
                
                if (qrCode && qrCode.data) {
                    stopScanning();
                    handleQRCodeDetected(qrCode.data);
                }
            } catch (error) {
                console.error('QR scanning error:', error);
            }
        }
        
        function stopScanning() {
            isScanning = false;
            if (scanningInterval) {
                clearInterval(scanningInterval);
                scanningInterval = null;
            }
        }
        
        function cancelScanning() {
            stopScanning();
            hideOverlay('scanner-overlay');
            if (gameState === 'scanOrigin') promptOriginScan();
            else if (gameState === 'scanCheckpoint') showStatusPanel();
        }
        
        function resetScannerAppearance() {
            const frame = document.getElementById('scanner-frame');
            const instruction = document.getElementById('scanner-instruction');
            frame.style.borderColor = GAME_CONFIG.appearance.scannerFrameColor;
            instruction.style.color = 'white';
        }
        
        function showScannerError(message) {
            const frame = document.getElementById('scanner-frame');
            const instruction = document.getElementById('scanner-instruction');
            frame.style.borderColor = GAME_CONFIG.appearance.scannerErrorColor;
            instruction.style.color = GAME_CONFIG.appearance.scannerErrorColor;
            instruction.textContent = message;
        }
        
        function handleQRCodeDetected(qrContent) {
            if (gameState === 'scanOrigin') {
                if (qrContent === GAME_CONFIG.originQR.content) {
                    hideOverlay('scanner-overlay');
                    isOriginSet = true;
                    setTimeout(() => startNavigationToCheckpoint(), 500);
                } else {
                    showScannerError('❌ Wrong QR! Scan ORIGIN marker');
                    setTimeout(() => { 
                        resetScannerAppearance(); 
                        startQRScanning(); 
                    }, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            } else if (gameState === 'scanCheckpoint') {
                const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                if (qrContent === checkpoint.qrCode) {
                    hideOverlay('scanner-overlay');
                    setTimeout(() => showQuestion(), 500);
                } else {
                    showScannerError(`❌ Wrong QR! Scan: ${checkpoint.name}`);
                    setTimeout(() => { 
                        resetScannerAppearance(); 
                        startQRScanning(); 
                    }, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            }
        }
        
        // ============================================
        // NAVIGATION SYSTEM
        // ============================================
        function promptOriginScan() {
            gameState = 'scanOrigin';
            showStatusPanel();
            document.getElementById('checkpoint-name').textContent = 'Welcome to HKBU Li Promenade!';
            document.getElementById('distance-display').textContent = '';
            document.getElementById('instruction-text').textContent = 'To begin your journey, please scan the ORIGIN QR code located at the starting point.';
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = 'Scan Origin QR Code';
            btn.onclick = startQRScanning;
        }
        
        function startNavigationToCheckpoint() {
            if (currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) {
                gameComplete();
                return;
            }
            
            gameState = 'navigating';
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            
            showStatusPanel();
            document.getElementById('arrow-container').style.display = 'block';
            document.getElementById('checkpoint-name').textContent = `Navigate to: ${checkpoint.name}`;
            
            // Initialize distance display
            if (GAME_CONFIG.behavior.showDistance) {
                if (hasGPSSignal) {
                    document.getElementById('distance-display').textContent = `${currentDistance}m away`;
                } else {
                    document.getElementById('distance-display').textContent = `~${checkpoint.fallbackDistance}m away`;
                }
            }
            
            document.getElementById('instruction-text').textContent = 
                `Follow the blue arrow to reach your destination.\n\nWhen you arrive, tap "I've Arrived".`;
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = "I've Arrived";
            btn.onclick = promptCheckpointScan;
        }
        
        function promptCheckpointScan() {
            gameState = 'scanCheckpoint';
            document.getElementById('arrow-container').style.display = 'none';
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            
            document.getElementById('checkpoint-name').textContent = 
                checkpoint.arrivalMessage || `Great! You've reached:`;
            document.getElementById('distance-display').textContent = checkpoint.name;
            document.getElementById('instruction-text').textContent = 
                'Now scan the checkpoint QR code to answer the question.';
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = 'Scan Checkpoint QR';
            btn.onclick = startQRScanning;
        }
        
        // ============================================
        // QUESTION SYSTEM
        // ============================================
        function showQuestion() {
            gameState = 'question';
            hideStatusPanel();
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            
            document.getElementById('question-text').textContent = checkpoint.question;
            const buttonContainer = document.getElementById('answer-buttons');
            buttonContainer.innerHTML = '';
            
            checkpoint.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.textContent = answer;
                button.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(button);
            });
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '';
            feedback.style.background = '';
            feedback.style.border = '';
            document.getElementById('continue-btn').style.display = 'none';
            
            showOverlay('question-overlay');
        }
        
        function checkAnswer(answerIndex) {
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            const feedback = document.getElementById('feedback');
            const continueBtn = document.getElementById('continue-btn');
            const buttons = document.querySelectorAll('.answer-btn');
            
            buttons.forEach(btn => btn.disabled = true);
            
            if (answerIndex === checkpoint.correctAnswerIndex) {
                feedback.textContent = '✅ Correct! Well done!';
                feedback.style.background = GAME_CONFIG.behavior.correctAnswerBg;
                feedback.style.color = GAME_CONFIG.behavior.correctAnswerText;
                feedback.style.border = `2px solid ${GAME_CONFIG.behavior.correctAnswerText}`;
                continueBtn.style.display = 'block';
            } else {
                let feedbackText = '❌ Incorrect. Please try again.';
                if (checkpoint.hint) feedbackText += `\n\nHint: ${checkpoint.hint}`;
                
                feedback.textContent = feedbackText;
                feedback.style.background = GAME_CONFIG.behavior.incorrectAnswerBg;
                feedback.style.color = GAME_CONFIG.behavior.incorrectAnswerText;
                feedback.style.border = `2px solid ${GAME_CONFIG.behavior.incorrectAnswerText}`;
                
                setTimeout(() => {
                    feedback.textContent = '';
                    feedback.style.background = '';
                    feedback.style.border = '';
                    buttons.forEach(btn => btn.disabled = false);
                }, GAME_CONFIG.behavior.incorrectAnswerDelay);
            }
        }
        
        function continueToNextCheckpoint() {
            hideOverlay('question-overlay');
            currentCheckpointIndex++;
            startNavigationToCheckpoint();
        }
        
        // ============================================
        // GAME COMPLETION
        // ============================================
        function gameComplete() {
            gameState = 'complete';
            hideAllOverlays();
            document.getElementById('arrow-container').style.display = 'none';
            
            showStatusPanel();
            document.getElementById('checkpoint-name').textContent = GAME_CONFIG.general.completionTitle;
            document.getElementById('distance-display').textContent = '';
            document.getElementById('instruction-text').textContent = GAME_CONFIG.general.completionMessage;
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = 'Restart Game';
            btn.onclick = () => location.reload();
        }
        
        // ============================================
        // DEBUG PANEL
        // ============================================
        function updateDebugPanelVisibility() {
            const debugPanel = document.getElementById('debug-compass');
            if (GAME_CONFIG.behavior.showDebugPanel && gameState === 'navigating') {
                debugPanel.style.display = 'block';
            } else {
                debugPanel.style.display = 'none';
            }
        }
        
        setInterval(updateDebugPanelVisibility, 1000);
        
        // ============================================
        // UI HELPER FUNCTIONS
        // ============================================
        function showStatusPanel() { 
            document.getElementById('status-panel').classList.remove('hidden'); 
        }
        
        function hideStatusPanel() { 
            document.getElementById('status-panel').classList.add('hidden'); 
        }
        
        function showOverlay(overlayId) { 
            document.getElementById(overlayId).classList.remove('hidden'); 
        }
        
        function hideOverlay(overlayId) { 
            document.getElementById(overlayId).classList.add('hidden'); 
        }
        
        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(overlay => {
                if (overlay.id !== 'welcome-screen') {
                    overlay.classList.add('hidden');
                }
            });
        }
        
        // ============================================
        // CLEANUP & INITIALIZATION
        // ============================================
        window.addEventListener('beforeunload', () => {
            stopCameraStream();
            stopScanning();
            stopGPSTracking();
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });
        
        window.addEventListener('DOMContentLoaded', () => {
            applyConfiguration();
            console.log('🚀 HKBU Li Promenade AR Game v4.0 - All Issues Fixed!');
            console.log('📍 GPS Navigation:', GAME_CONFIG.behavior.useGPS ? 'ENABLED' : 'DISABLED');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>香港浸會大學 李作權大道 AR 互動遊戲</title>
    
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'PingFang HK', 'Heiti TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000; overflow: hidden; width: 100vw; height: 100vh; position: fixed;
        }
        
        #camera-view {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1; background: #000;
        }
        
        #qr-canvas { display: none; }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        
        .hidden { display: none !important; }
        
        /* ============================================================
           歡迎畫面 - 卡片式 PNG 設計
           ============================================================ */
        #welcome-screen {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000000 100%);
            padding: 20px;
        }

        /* PNG 圖片卡片容器 */
        #welcome-card {
            position: relative;
            
            /* 🎛️ 調整這些數值來控制卡片大小 */
            width: 100vw;              /* 卡片寬度（左右各留邊距）*/
            max-width: 400px;         /* 最大寬度限制 */
            aspect-ratio: 9 / 16;     /* 長寬比（配合你的 PNG）*/
            max-height: 90vh;         /* 最大高度限制 */

            /* 視覺效果 */
            border-radius: 20px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 0 30px rgba(0, 255, 255, 0.2);

            /* PNG 圖片填滿整個卡片 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a2e;

            overflow: hidden;
            animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardEntrance {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 底部漸層遮罩（讓按鈕更清晰）*/
        #welcome-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 30%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.3) 60%,
                rgba(0, 0, 0, 0.7) 100%
            );
            pointer-events: none;
            border-radius: 0 0 20px 20px;
        }

        /* 卡片內的文字區域（可選顯示）*/
        #welcome-text-area {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px 20px;
            z-index: 2;
        }

        #welcome-title {
            font-size: clamp(18px, 4.5vw, 24px);
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 10px;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        #welcome-message {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(12px, 3vw, 15px);
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-line;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }

        /* 🔘 縮小的開始按鈕 - 置於 PNG 卡片內 */
        #start-game-btn {
            width: 70%;
            max-width: 220px;
            padding: 12px 24px;

            margin-bottom: 25px;  /* 調整這個數值控制高度 */
            
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: clamp(15px, 3.5vw, 18px);
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
            
            position: relative;
            z-index: 3;
            
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            animation: btnBreath 2.5s ease-in-out infinite;
            transition: transform 0.15s ease;
        }

        @keyframes btnBreath {
            0%, 100% { box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3); }
            50% { box-shadow: 0 6px 25px rgba(0, 255, 255, 0.5); }
        }

        #start-game-btn:active {
            transform: scale(0.95);
        }

        /* ============================================================
           導航箭頭（PNG 版本）
           ============================================================ */
        #arrow-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 15; display: none; pointer-events: none;
            animation: arrowPulse 2s ease-in-out infinite;
        }
        
        #navigation-arrow {
            width: 100%; height: 100%;
            background-size: contain; background-position: center; background-repeat: no-repeat;
            will-change: transform; filter: drop-shadow(0 0 20px rgba(0,255,255,0.8));
        }
        
        @keyframes arrowPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(0,255,255,1)); }
        }
        
        /* ============================================================
           其他系統樣式（保持不變）
           ============================================================ */
        #arrival-indicator {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(0, 255, 136, 0.95); color: #000; padding: 15px 30px;
            border-radius: 25px; font-size: 18px; font-weight: bold;
            z-index: 25; display: none; text-align: center;
            backdrop-filter: blur(5px); box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
            animation: arrivalBounce 0.6s ease-out;
        }
        
        @keyframes arrivalBounce {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
        
        #status-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(15px); color: white; padding: 20px 20px 30px; z-index: 20;
        }
        
        #checkpoint-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; text-align: center; }
        #distance-display { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); transition: color 0.5s ease; }
        .dist-far { color: #FFFFFF !important; } .dist-medium { color: #FFD700 !important; } .dist-close { color: #00FF88 !important; } .dist-arrived { color: #00FF00 !important; }
        #instruction-text { font-size: 14px; text-align: center; margin-bottom: 15px; line-height: 1.6; color: #CCCCCC; white-space: pre-line; }
        
        #main-action-btn { display: block; width: 100%; max-width: 300px; margin: 0 auto; padding: 15px 30px; color: #000; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        #main-action-btn:active { transform: scale(0.97); }
        
        @keyframes btnPulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(0, 255, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); } }
        .arrived-pulse { animation: btnPulse 1.5s infinite; background: linear-gradient(135deg, #00FF00 0%, #00AA00 100%) !important; color: white !important; }
        
        #video-overlay { flex-direction: column; background: #000; position: relative; }
        #game-video { width: 100vw; height: 100vh; object-fit: cover; }
        #video-controls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 101; }
        #skip-video-btn { padding: 12px 30px; background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); }
        
        #scanner-overlay { background: transparent; }
        #scanner-container { position: relative; width: 100%; height: 100%; }
        #scanner-frame { position: absolute; width: 280px; height: 280px; top: 107px; left: 50%; transform: translateX(-50%); border: 4px solid #00ffff; border-radius: 20px; background: transparent; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.8), 0 0 16px #00ffff; transition: border-color 0.3s ease; z-index: 10; }
        #scanner-frame::before { content: ''; position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; border: 3px solid #00FFFF; border-radius: 50%; transform: translate(-50%, -50%); animation: scanPulse 2s infinite; }
        @keyframes scanPulse { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.3); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        #scanner-instruction { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 80%; font-size: 18px; line-height: 1.6; text-align: center; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.9); z-index: 11; }
        #cancel-scan-btn { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); padding: 12px 30px; background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); z-index: 11; }
        
        #question-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; background: transparent; }
        #question-overlay::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(4px); z-index: 1; }
        #question-container { position: relative; width: 100%; height: 100%; z-index: 2; }
        #quiz-panel-background { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); width: 251px; height: 222px; background-image: url('quiz-panel.png'); background-size: 100% 100%; background-repeat: no-repeat; background-color: transparent; image-rendering: pixelated; z-index: 10; filter: drop-shadow(0 8px 25px rgba(0,0,0,0.4)); }
        #question-text { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); font-size: 13px; text-align: left; width: 180px; font-weight: bold; line-height: 1.5; color: #333; text-shadow: 0 1px 2px rgba(255,255,255,0.7); margin-top: 40px; margin-left: 30px; z-index: 12; }
        #answer-buttons { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .answer-btn { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: auto; width: 280px; height: 55px; font-size: 14px; padding: 0 10px; border: none; cursor: pointer; background-image: url('button-blue.png'); background-size: 100% 100%; background-repeat: no-repeat; background-color: transparent; image-rendering: pixelated; color: #333; font-weight: bold; text-shadow: 0 1px 1px rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.3; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
        .answer-btn:active { transform: translateX(-50%) scale(0.98); }
        .answer-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: translateX(-50%); }
        .answer-btn:nth-child(1) { top: 300px; } .answer-btn:nth-child(2) { top: 360px; } .answer-btn:nth-child(3) { top: 420px; } .answer-btn:nth-child(4) { top: 480px; }
        #feedback { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 300px; padding: 15px; border-radius: 10px; font-size: 15px; font-weight: bold; white-space: pre-line; line-height: 1.6; text-align: center; z-index: 20; backdrop-filter: blur(8px); }
        #continue-btn { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 200px; padding: 12px 30px; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4); z-index: 21; display: none; backdrop-filter: blur(5px); }
        #continue-btn:active { transform: translateX(-50%) scale(0.98); }
        
        #gps-indicator { position: fixed; top: 15px; right: 15px; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.8); border: 3px solid #555; z-index: 30; display: none; align-items: center; justify-content: center; font-size: 20px; backdrop-filter: blur(5px); transition: all 0.5s ease; }
        .gps-acquiring { border-color: #FFD700 !important; animation: gpsBlink 1s infinite; }
        .gps-good { border-color: #00FF88 !important; }
        .gps-poor { border-color: #FF6B35 !important; }
        @keyframes gpsBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        #debug-compass { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.92); color: #00FF00; padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 11px; z-index: 9999; display: none; border: 2px solid #00FF00; min-width: 240px; backdrop-filter: blur(10px); line-height: 1.4; }
        #debug-compass div { margin: 2px 0; }
        #debug-compass span { color: #00FFFF; font-weight: bold; }
        .val-good { color: #00FF88 !important; } .val-warn { color: #FFD700 !important; } .val-bad { color: #FF4444 !important; }
    </style>
</head>
<body>

    <script>
        // ================================================================
        //                     遊戲配置（Unity Inspector 風格）
        // ================================================================
        const GAME_CONFIG = {
            general: {
                gameName: "香港浸會大學 李作權大道 AR 互動遊戲",
                welcomeTitle: "🎓 香港浸會大學\n李作權大道 AR 互動遊戲",
                welcomeMessage: "歡迎來到互動導航體驗！\n\n你將探索浸大的李作權大道，在步行的同時回答與環境氣候相關的問題並學習新知識 🔆。\n\n✅ 請在系統提示時，允許程式存取相機、動作及方向感應器。",
                completionTitle: "🎉 恭喜完成！",
                completionMessage: "你已成功完成香港浸會大學\n李作權大道 AR 互動導覽！\n\n感謝你與我們一起探索。"
            },
            
            video: {
                enableIntroVideo: true, enableOutroVideo: false,
                introVideoPath: "intro.mp4", outroVideoPath: "outro.mp4",
                showSkipButton: true, skipButtonText: "跳過影片", autoPlayVideos: true
            },
            
            // ==================== 圖片資源配置 ====================
            assets: {
                // 歡迎頁面 PNG（建議 1080×1920px，9:16 比例）
                welcomeBackground: "welcome-bg.png",
                
                // 🎛️ 卡片自訂參數（輕鬆調整大小）
                cardWidth: "95vw",           // 卡片寬度（87vw = 左右各留 6.5% 邊距） // 卡片寬度（數值越小邊距越大）
                cardMaxWidth: "400px",       // 最大寬度
                cardAspectRatio: "9 / 16",   // 長寬比（配合你的 PNG）
                cardMaxHeight: "80vh",       // 最大高度
                
                // 導航箭頭圖片（512×512px，透明背景，箭頭朝上）
                navigationArrow: "arrow.png",
                
                // 是否顯示 HTML 文字（PNG 已有設計文字時設為 false）
                showWelcomeText: false,
                
                // 開始按鈕文字
                startButtonText: "開始我們的旅程！"
            },
            
            appearance: {
                arrowSize: 130, primaryColor: "#00FFFF", buttonColor: "#00FFFF",
                scannerFrameColor: "#00FFFF", scannerErrorColor: "#FF3B30"
            },
            
            navigation: {
                arrivalRadius: 12, proximityRadius: 25, gpsHighAccuracy: true,
                gpsMaxAge: 2000, gpsTimeout: 10000, headingSmoothness: 0.15,
                minGPSAccuracy: 30, showDebugPanel: true
            },
            
            behavior: {
                qrScanInterval: 500, scanErrorTimeout: 1500, incorrectAnswerDelay: 4000,
                correctAnswerBg: "rgba(212, 237, 218, 0.9)", correctAnswerText: "#155724",
                incorrectAnswerBg: "rgba(248, 215, 218, 0.9)", incorrectAnswerText: "#721c24"
            },
            
            originQR: { content: "HKBU_LI_PROMENADE_ORIGIN", lat: 22.337222, lng: 114.181944 },
            
            checkpoints: [
                {
                    name: "圖書館台階", qrCode: "HKBU_CP1", lat: 22.338333, lng: 114.182222,
                    question: "哪種氣體是導致全球暖化主要的溫室氣體？",
                    answers: ["A. 氮氣 (N₂)", "B. 氧氣 (O₂)", "C. 二氧化碳 (CO₂)", "D. 氬氣 (Ar)"],
                    correctAnswerIndex: 2, hint: "這種氣體主要來自燃燒化石燃料（如汽車廢氣）以及我們的呼吸，植物則會吸收它。",
                    arrivalMessage: "📍 你已到達圖書館台階！"
                },
                {
                    name: "學生中心", qrCode: "HKBU_CP2", lat: 22.337778, lng: 114.181944,
                    question: "哪種做法最能有效減少日常交通產生的溫室氣體排放？",
                    answers: ["A. 短途旅行也獨自駕駛私家車", "B. 盡可能搭乘大眾運輸工具、騎單車或步行", "C. 停車等候時不熄火（引擎保持怠速）", "D. 捨棄火車，改為頻繁搭乘短途飛機"],
                    correctAnswerIndex: 1, hint: "想想看，哪種方式可以讓更多人同時移動，或者完全不需要消耗燃料？",
                    arrivalMessage: "📍 你已到達學生中心！"
                },
                {
                    name: "教學大樓", qrCode: "HKBU_CP3", lat: 22.337625, lng: 114.181944,
                    question: "哪種能源屬於可再生能源，且在發電時有助於減少大氣污染？",
                    answers: ["A. 煤炭", "B. 天然氣", "C. 風能", "D. 柴油"],
                    correctAnswerIndex: 2, hint: "這種能源來自大自然中永不枯竭的力量，且發電過程非常潔淨。",
                    arrivalMessage: "📍 你已到達教學大樓！"
                }
            ]
        };

        // 遊戲狀態變數
        let gameState = 'welcome';
        let currentCheckpointIndex = 0;
        let deviceHeading = 0;
        let smoothedHeading = 0;
        let videoStream = null;
        let scanningInterval = null;
        let isScanning = false;
        let animationFrameId = null;
        let currentLat = null;
        let currentLng = null;
        let watchPositionId = null;
        let currentDistance = 9999;
        let dynamicBearing = 0;
        let gpsAccuracy = 999;
        let hasGPSSignal = false;
        let hasArrivedAtTarget = false;

        // GPS 計算函式
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180;
            const λ1 = lon1*Math.PI/180, λ2 = lon2*Math.PI/180;
            const y = Math.sin(λ2-λ1)*Math.cos(φ2);
            const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(λ2-λ1);
            return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
        }

        function startGPSTracking() {
            if (!navigator.geolocation) return;
            const gpsEl = document.getElementById('gps-indicator');
            gpsEl.style.display = 'flex'; gpsEl.className = 'gps-acquiring'; gpsEl.textContent = '📡';
            watchPositionId = navigator.geolocation.watchPosition(onGPSSuccess, onGPSError, {
                enableHighAccuracy: GAME_CONFIG.navigation.gpsHighAccuracy,
                maximumAge: GAME_CONFIG.navigation.gpsMaxAge, timeout: GAME_CONFIG.navigation.gpsTimeout
            });
        }

        function onGPSSuccess(position) {
            hasGPSSignal = true; currentLat = position.coords.latitude; currentLng = position.coords.longitude;
            gpsAccuracy = Math.round(position.coords.accuracy);
            const gpsEl = document.getElementById('gps-indicator');
            gpsEl.className = gpsAccuracy < GAME_CONFIG.navigation.minGPSAccuracy ? 'gps-good' : 'gps-poor';
            gpsEl.textContent = gpsAccuracy < GAME_CONFIG.navigation.minGPSAccuracy ? '📍' : '⚠️';
            if (gameState !== 'navigating' || currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) return;
            const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            currentDistance = calculateDistance(currentLat, currentLng, cp.lat, cp.lng);
            dynamicBearing = calculateBearing(currentLat, currentLng, cp.lat, cp.lng);
            updateNavigationUI();
        }

        function onGPSError(error) {
            hasGPSSignal = false;
            const gpsEl = document.getElementById('gps-indicator');
            gpsEl.className = 'gps-poor'; gpsEl.textContent = '❌';
        }

        function stopGPSTracking() {
            if (watchPositionId && navigator.geolocation) {
                navigator.geolocation.clearWatch(watchPositionId); watchPositionId = null;
            }
            hasGPSSignal = false; document.getElementById('gps-indicator').style.display = 'none';
        }

        function updateNavigationUI() {
            const distEl = document.getElementById('distance-display');
            const instrEl = document.getElementById('instruction-text');
            const actionBtn = document.getElementById('main-action-btn');
            const arrowEl = document.getElementById('arrow-container');
            const arrivalEl = document.getElementById('arrival-indicator');
            const d = Math.round(currentDistance);

            if (currentDistance <= GAME_CONFIG.navigation.arrivalRadius && !hasArrivedAtTarget) {
                hasArrivedAtTarget = true;
                distEl.textContent = "📍 您已到達附近！"; distEl.className = 'dist-arrived';
                instrEl.textContent = "請在周圍尋找實體的二維碼標誌。";
                arrivalEl.textContent = `🎯 已到達「${GAME_CONFIG.checkpoints[currentCheckpointIndex].name}」附近！`;
                arrivalEl.style.display = 'block'; arrowEl.style.opacity = '0.2';
                actionBtn.classList.add('arrived-pulse'); actionBtn.textContent = "掃描二維碼";
                actionBtn.onclick = () => { gameState = 'scanCheckpoint'; startQRScanning(); };
            } else if (!hasArrivedAtTarget) {
                distEl.textContent = `距離約 ${d} 米`;
                distEl.className = d > 100 ? 'dist-far' : d > 50 ? 'dist-medium' : 'dist-close';
                instrEl.textContent = d <= GAME_CONFIG.navigation.proximityRadius ? "你正在接近目標！繼續跟隨箭頭前進。" : "請跟隨箭頭前往目的地。";
                arrowEl.style.opacity = '1'; actionBtn.classList.remove('arrived-pulse');
                actionBtn.textContent = "我已到達"; actionBtn.onclick = manualArrival;
            }
        }

        function manualArrival() { if (!hasArrivedAtTarget) { hasArrivedAtTarget = true; updateNavigationUI(); } }

        // 相機系統
        async function startCameraStream() {
            try {
                if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }
                });
                const v = document.getElementById('camera-view');
                v.srcObject = videoStream;
                await new Promise(resolve => { v.onloadedmetadata = () => { v.play().catch(()=>{}); resolve(); }; });
            } catch(e) { alert('無法存取相機，請確認已授予相機權限並重試。'); }
        }

        function stopCameraStream() { if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; } }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && gameState !== 'welcome') {
                await startCameraStream();
                window.addEventListener('deviceorientation', handleOrientationChange, true);
                window.addEventListener('deviceorientationabsolute', handleOrientationChange, true);
            } else { stopCameraStream(); }
        });

        // 羅盤系統
        function handleOrientationChange(event) {
            let h = null;
            if (event.webkitCompassHeading !== undefined) h = event.webkitCompassHeading;
            else if (event.alpha !== null) h = 360 - event.alpha;
            if (h !== null) deviceHeading = h;
        }

        function startRenderLoop() {
            (function render() {
                let diff = deviceHeading - smoothedHeading;
                if (diff > 180) diff -= 360; if (diff < -180) diff += 360;
                smoothedHeading += diff * GAME_CONFIG.navigation.headingSmoothness;
                if (smoothedHeading < 0) smoothedHeading += 360; if (smoothedHeading >= 360) smoothedHeading -= 360;
                if (gameState === 'navigating' && currentCheckpointIndex < GAME_CONFIG.checkpoints.length) updateNavigationArrow();
                animationFrameId = requestAnimationFrame(render);
            })();
        }

        function updateNavigationArrow() {
            const target = hasGPSSignal ? dynamicBearing : 0;
            let rot = target - smoothedHeading;
            while (rot > 180) rot -= 360; while (rot < -180) rot += 360;
            document.getElementById('navigation-arrow').style.transform = `rotate(${rot}deg)`;
            if (GAME_CONFIG.navigation.showDebugPanel) {
                document.getElementById('debug-heading').textContent = Math.round(smoothedHeading);
                document.getElementById('debug-target').textContent = Math.round(target);
                document.getElementById('debug-rotation').textContent = Math.round(rot);
                document.getElementById('debug-dist').textContent = Math.round(currentDistance);
                const accEl = document.getElementById('debug-acc');
                accEl.textContent = gpsAccuracy + 'm';
                accEl.className = gpsAccuracy < 10 ? 'val-good' : gpsAccuracy < 30 ? 'val-warn' : 'val-bad';
            }
        }

        // ================================================================
        //                  配置應用（圖片載入核心）
        // ================================================================
        function applyConfiguration() {
            const cfg = GAME_CONFIG;

            // 🎯 應用卡片設定和背景圖片
            const card = document.getElementById('welcome-card');
            card.style.backgroundImage = `url('${cfg.assets.welcomeBackground}')`;
            card.style.width = cfg.assets.cardWidth;
            card.style.maxWidth = cfg.assets.cardMaxWidth;
            card.style.aspectRatio = cfg.assets.cardAspectRatio;
            card.style.maxHeight = cfg.assets.cardMaxHeight;

            // 控制文字顯示
            const titleEl = document.getElementById('welcome-title');
            const msgEl = document.getElementById('welcome-message');
            if (!cfg.assets.showWelcomeText) {
                titleEl.style.display = 'none'; msgEl.style.display = 'none';
            } else {
                titleEl.textContent = cfg.general.welcomeTitle;
                titleEl.style.color = cfg.appearance.primaryColor;
                msgEl.textContent = cfg.general.welcomeMessage;
            }

            // 按鈕設定
            const startBtn = document.getElementById('start-game-btn');
            const actionBtn = document.getElementById('main-action-btn');
            const gradient = `linear-gradient(135deg, ${cfg.appearance.buttonColor} 0%, ${cfg.appearance.buttonColor}DD 100%)`;
            startBtn.textContent = cfg.assets.startButtonText;
            startBtn.style.background = gradient;
            actionBtn.style.background = gradient;

            // 導航箭頭
            const arrowContainer = document.getElementById('arrow-container');
            const arrow = document.getElementById('navigation-arrow');
            arrowContainer.style.width = cfg.appearance.arrowSize + 'px';
            arrowContainer.style.height = cfg.appearance.arrowSize + 'px';
            arrow.style.backgroundImage = `url('${cfg.assets.navigationArrow}')`;

            // 其他設定
            document.getElementById('status-panel').style.borderTopColor = cfg.appearance.primaryColor;
            document.getElementById('checkpoint-name').style.color = cfg.appearance.primaryColor;
            document.getElementById('skip-video-btn').textContent = cfg.video.skipButtonText;
            if (!cfg.video.showSkipButton) document.getElementById('skip-video-btn').style.display = 'none';

            console.log('✅ 卡片式歡迎頁面已套用，卡片寬度:', cfg.assets.cardWidth);
        }

        // 遊戲啟動
        async function startGame() {
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') { alert('🧭 導航需要羅盤權限，請允許存取！'); return; }
                }
                window.addEventListener('deviceorientation', handleOrientationChange, true);
                window.addEventListener('deviceorientationabsolute', handleOrientationChange, true);
                await startCameraStream(); startGPSTracking(); startRenderLoop();
                hideOverlay('welcome-screen');
                GAME_CONFIG.video.enableIntroVideo ? playIntroVideo() : promptOriginScan();
            } catch(e) { alert('無法啟動遊戲，請允許相機及動作感應器權限。'); }
        }

        // 其他遊戲系統（簡化版本，保持功能完整）
        function playIntroVideo() {
            gameState = 'introVideo';
            const v = document.getElementById('game-video');
            document.getElementById('video-source').src = GAME_CONFIG.video.introVideoPath;
            v.load(); if (GAME_CONFIG.video.autoPlayVideos) v.play().catch(()=>{});
            v.onended = () => { hideOverlay('video-overlay'); promptOriginScan(); };
            showOverlay('video-overlay');
        }

        function skipVideo() {
            document.getElementById('game-video').pause(); hideOverlay('video-overlay');
            if (gameState === 'introVideo') promptOriginScan(); else if (gameState === 'outroVideo') gameComplete();
        }

        function startQRScanning() {
            if (isScanning) return;
            isScanning = true; hideStatusPanel(); showOverlay('scanner-overlay');
            document.getElementById('scanner-frame').style.borderColor = GAME_CONFIG.appearance.scannerFrameColor;
            document.getElementById('scanner-instruction').style.color = 'white';
            document.getElementById('scanner-instruction').textContent = gameState === 'scanOrigin' ? '請掃描起點二維碼' : `請掃描「${GAME_CONFIG.checkpoints[currentCheckpointIndex].name}」的二維碼`;
            scanningInterval = setInterval(scanForQRCode, GAME_CONFIG.behavior.qrScanInterval);
        }

        function scanForQRCode() {
            const video = document.getElementById('camera-view'), canvas = document.getElementById('qr-canvas'), ctx = canvas.getContext('2d');
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            try {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
                if (qr && qr.data) { stopScanning(); handleQRCodeDetected(qr.data); }
            } catch(e) { console.error('QR錯誤:', e); }
        }

        function stopScanning() { isScanning = false; if (scanningInterval) { clearInterval(scanningInterval); scanningInterval = null; } }
        function cancelScanning() { stopScanning(); hideOverlay('scanner-overlay'); if (gameState === 'scanOrigin') promptOriginScan(); else showStatusPanel(); }

        function handleQRCodeDetected(content) {
            if (gameState === 'scanOrigin') {
                if (content === GAME_CONFIG.originQR.content) {
                    hideOverlay('scanner-overlay'); setTimeout(startNavigationToCheckpoint, 500);
                } else {
                    document.getElementById('scanner-instruction').textContent = '❌ 二維碼錯誤！請掃描起點標記';
                    document.getElementById('scanner-instruction').style.color = GAME_CONFIG.appearance.scannerErrorColor;
                    setTimeout(startQRScanning, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            } else if (gameState === 'scanCheckpoint') {
                const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                if (content === cp.qrCode) {
                    hideOverlay('scanner-overlay'); setTimeout(showQuestion, 500);
                } else {
                    document.getElementById('scanner-instruction').textContent = `❌ 二維碼錯誤！請掃描「${cp.name}」`;
                    document.getElementById('scanner-instruction').style.color = GAME_CONFIG.appearance.scannerErrorColor;
                    setTimeout(startQRScanning, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            }
        }

        function promptOriginScan() {
            gameState = 'scanOrigin'; showStatusPanel();
            document.getElementById('checkpoint-name').textContent = '歡迎來到李作權大道！';
            document.getElementById('distance-display').textContent = '';
            document.getElementById('instruction-text').textContent = '若要開啟你的旅程，請掃描位於起點處的二維碼 📍';
            const btn = document.getElementById('main-action-btn');
            btn.textContent = '掃描起點二維碼'; btn.onclick = startQRScanning; btn.classList.remove('arrived-pulse');
        }

        function startNavigationToCheckpoint() {
            if (currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) { gameComplete(); return; }
            gameState = 'navigating'; hasArrivedAtTarget = false;
            document.getElementById('arrival-indicator').style.display = 'none';
            showStatusPanel(); document.getElementById('arrow-container').style.display = 'block';
            document.getElementById('arrow-container').style.opacity = '1';
            document.getElementById('checkpoint-name').textContent = `導航至：${GAME_CONFIG.checkpoints[currentCheckpointIndex].name}`;
            document.getElementById('distance-display').textContent = '正在定位…';
            document.getElementById('instruction-text').textContent = '請跟隨箭頭前往目的地。\n\n抵達後系統會自動偵測，或點擊「我已到達」。';
            const btn = document.getElementById('main-action-btn');
            btn.classList.remove('arrived-pulse'); btn.textContent = '我已到達'; btn.onclick = manualArrival;
        }

        function showQuestion() {
            gameState = 'question'; hideStatusPanel();
            document.getElementById('gps-indicator').style.display = 'none';
            document.getElementById('arrival-indicator').style.display = 'none';
            const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            document.getElementById('question-text').textContent = cp.question;
            const container = document.getElementById('answer-buttons'); container.innerHTML = '';
            cp.answers.forEach((ans, i) => {
                const btn = document.createElement('button'); btn.className = 'answer-btn';
                btn.textContent = ans; btn.onclick = () => checkAnswer(i); container.appendChild(btn);
            });
            document.getElementById('feedback').textContent = '';
            document.getElementById('continue-btn').style.display = 'none';
            showOverlay('question-overlay');
        }

        function checkAnswer(idx) {
            const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex], fb = document.getElementById('feedback');
            document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
            if (idx === cp.correctAnswerIndex) {
                fb.textContent = '✅ 答對了！做得好！';
                fb.style.background = GAME_CONFIG.behavior.correctAnswerBg;
                document.getElementById('continue-btn').style.display = 'block';
            } else {
                fb.textContent = '❌ 答錯了，請再試一次。\n\n💡 提示：' + cp.hint;
                fb.style.background = GAME_CONFIG.behavior.incorrectAnswerBg;
                setTimeout(() => {
                    fb.textContent = ''; fb.style.background = '';
                    document.querySelectorAll('.answer-btn').forEach(b => b.disabled = false);
                }, GAME_CONFIG.behavior.incorrectAnswerDelay);
            }
        }

        function continueToNextCheckpoint() { hideOverlay('question-overlay'); currentCheckpointIndex++; startNavigationToCheckpoint(); }

        function gameComplete() {
            gameState = 'complete'; hideAllOverlays();
            document.getElementById('arrow-container').style.display = 'none';
            document.getElementById('arrival-indicator').style.display = 'none';
            document.getElementById('gps-indicator').style.display = 'none';
            showStatusPanel();
            document.getElementById('checkpoint-name').textContent = GAME_CONFIG.general.completionTitle;
            document.getElementById('distance-display').textContent = '';
            document.getElementById('instruction-text').textContent = GAME_CONFIG.general.completionMessage;
            const btn = document.getElementById('main-action-btn');
            btn.textContent = '重新開始'; btn.onclick = () => location.reload(); btn.classList.remove('arrived-pulse');
        }

        // UI 輔助函式
        function showOverlay(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideOverlay(id) { document.getElementById(id).classList.add('hidden'); }
        function showStatusPanel() { document.getElementById('status-panel').classList.remove('hidden'); }
        function hideStatusPanel() { document.getElementById('status-panel').classList.add('hidden'); }
        function hideAllOverlays() { document.querySelectorAll('.overlay').forEach(o => { if (o.id !== 'welcome-screen') o.classList.add('hidden'); }); }

        setInterval(() => {
            document.getElementById('debug-compass').style.display = (GAME_CONFIG.navigation.showDebugPanel && gameState === 'navigating') ? 'block' : 'none';
        }, 1000);

        window.addEventListener('beforeunload', () => { stopCameraStream(); stopScanning(); stopGPSTracking(); if (animationFrameId) cancelAnimationFrame(animationFrameId); });
        window.addEventListener('DOMContentLoaded', () => { applyConfiguration(); console.log('🚀 HKBU AR Game v10.0 - 卡片式歡迎頁面'); });
    </script>

    <!-- HTML 元素 -->
    <video id="camera-view" autoplay muted playsinline></video>
    <canvas id="qr-canvas"></canvas>

    <div id="arrow-container"><div id="navigation-arrow"></div></div>
    <div id="arrival-indicator"></div>
    <div id="gps-indicator">📡</div>

    <div id="status-panel" class="hidden">
        <div id="checkpoint-name"></div>
        <div id="distance-display"></div>
        <div id="instruction-text"></div>
        <button id="main-action-btn"></button>
    </div>

    <!-- 🎯 卡片式歡迎畫面 -->
    <div id="welcome-screen" class="overlay">
        <div id="welcome-card">
            <div id="welcome-text-area">
                <h1 id="welcome-title"></h1>
                <p id="welcome-message"></p>
                <button id="start-game-btn" onclick="startGame()">開始我們的旅程！</button>
            </div>
        </div>
    </div>

    <div id="video-overlay" class="overlay hidden">
        <video id="game-video" playsinline><source id="video-source" src="" type="video/mp4"></video>
        <div id="video-controls"><button id="skip-video-btn" onclick="skipVideo()"></button></div>
    </div>

    <div id="scanner-overlay" class="overlay hidden">
        <div id="scanner-container">
            <div id="scanner-frame"></div>
            <p id="scanner-instruction"></p>
            <button id="cancel-scan-btn" onclick="cancelScanning()">取消</button>
        </div>
    </div>

    <div id="question-overlay" class="overlay hidden">
        <div id="question-container">
            <div id="quiz-panel-background"></div>
            <h2 id="question-text"></h2>
            <div id="answer-buttons"></div>
            <div id="feedback"></div>
            <button id="continue-btn" onclick="continueToNextCheckpoint()">繼續 ▶</button>
        </div>
    </div>

    <div id="debug-compass">
        <div>🧭 GPS 動態導航 v10.0</div>
        <div>羅盤方向: <span id="debug-heading">0</span>°</div>
        <div>動態方位: <span id="debug-target">-</span>°</div>
        <div>箭頭旋轉: <span id="debug-rotation">0</span>°</div>
        <div>GPS距離: <span id="debug-dist">-</span> 米</div>
        <div>GPS精度: <span id="debug-acc">-</span></div>
    </div>
</body>
</html>

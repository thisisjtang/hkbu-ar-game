<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>香港浸會大學 李作權大道 AR 互動遊戲</title>
    
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'PingFang HK', 'Heiti TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000; overflow: hidden; width: 100vw; height: 100vh; position: fixed;
        }
        
        #camera-view {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1; background: #000;
        }
        
        #qr-canvas { display: none; }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }
        
        .hidden { display: none !important; }
        
        /* ==================== 歡迎畫面 ==================== */
        #welcome-screen {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000000 100%);
            padding: 20px;
        }

        #welcome-card {
            position: relative; width: 87vw; max-width: 400px; aspect-ratio: 9 / 16; max-height: 85vh;
            border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1), 0 0 30px rgba(0,255,255,0.2);
            background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #1a1a2e;
            overflow: hidden; animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardEntrance { 
            0% { opacity: 0; transform: scale(0.9) translateY(20px); } 
            100% { opacity: 1; transform: scale(1) translateY(0); } 
        }

        #welcome-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.7) 100%);
            pointer-events: none; border-radius: 0 0 20px 20px;
        }

        #welcome-text-area {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding: 0 20px 60px; z-index: 2;
        }

        #welcome-title { 
            font-size: clamp(18px, 4.5vw, 24px); font-weight: bold; text-align: center; line-height: 1.4; 
            margin-bottom: 10px; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.9); 
        }
        #welcome-message { 
            color: rgba(255,255,255,0.9); font-size: clamp(12px, 3vw, 15px); line-height: 1.6; 
            margin-bottom: 20px; white-space: pre-line; text-align: center; 
            text-shadow: 0 1px 4px rgba(0,0,0,0.9); 
        }

        #start-game-btn {
            width: 70%; max-width: 220px; padding: 12px 24px; margin-bottom: 35px;
            color: #000; border: none; border-radius: 25px; font-size: clamp(15px, 3.5vw, 18px);
            font-weight: bold; cursor: pointer; letter-spacing: 0.5px; position: relative; z-index: 3;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4); animation: btnBreath 2.5s ease-in-out infinite; 
            transition: transform 0.15s ease;
        }

        @keyframes btnBreath { 
            0%, 100% { box-shadow: 0 4px 15px rgba(0,255,255,0.3); } 
            50% { box-shadow: 0 6px 25px rgba(0,255,255,0.5); } 
        }
        #start-game-btn:active { transform: scale(0.95); }

        /* ==================== 計時器 ==================== */
        #timer-display {
            position: fixed; top: 15px; left: 15px; z-index: 40;
            padding: 10px 16px; border-radius: 16px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            border: 2px solid rgba(0,255,255,0.6);
            color: #00FFFF; font-size: 18px; font-weight: bold;
            font-variant-numeric: tabular-nums; display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: border-color 0.4s ease, color 0.4s ease;
        }

        #timer-display.timer-warning {
            border-color: rgba(255,80,80,0.8);
            color: #FF5050;
            animation: timerWarningPulse 0.8s ease-in-out infinite;
        }

        @keyframes timerWarningPulse {
            0%, 100% { 
                box-shadow: 0 4px 20px rgba(255,80,80,0.3); 
                transform: scale(1); 
            }
            50% { 
                box-shadow: 0 4px 28px rgba(255,80,80,0.6); 
                transform: scale(1.05); 
            }
        }

        /* ==================== 導航箭頭 ==================== */
        #arrow-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 15; display: none; pointer-events: none; transition: opacity 0.3s ease;
        }
        
        #navigation-arrow {
            width: 100%; height: 100%; background-size: contain; background-position: center;
            background-repeat: no-repeat; will-change: transform;
        }

        /* ==================== 狀態面板 ==================== */
        #status-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(15px); color: white; padding: 20px 20px 30px; z-index: 20;
        }
        
        #checkpoint-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; text-align: center; }
        #distance-display { 
            font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 10px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); transition: all 0.5s ease; min-height: 40px;
        }
        
        .dist-far { color: #FFFFFF !important; }
        .dist-medium { color: #FFD700 !important; }
        .dist-close { color: #00FF88 !important; }
        .dist-proximity { color: #00FF00 !important; font-size: 20px !important; }
        
        #instruction-text { 
            font-size: 14px; text-align: center; margin-bottom: 15px; line-height: 1.6; 
            color: #CCCCCC; white-space: pre-line; 
        }
        
        #main-action-btn { 
            display: block; width: 100%; max-width: 300px; margin: 0 auto; padding: 15px 30px; 
            color: #000; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; 
            cursor: pointer; transition: all 0.3s ease; pointer-events: auto !important;
        }
        
        #main-action-btn:active { transform: scale(0.97); }
        
        @keyframes scanPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
        .scan-ready {
            animation: scanPulse 1.5s infinite !important;
            background: linear-gradient(135deg, #00FF88 0%, #00CC66 100%) !important;
            color: #000 !important;
        }

        /* ==================== GPS 指示器 ==================== */
        #gps-indicator { 
            position: fixed; top: 15px; right: 15px; width: 50px; height: 50px; border-radius: 50%; 
            background: rgba(0,0,0,0.8); border: 3px solid #555; z-index: 30; display: none; 
            align-items: center; justify-content: center; font-size: 20px; backdrop-filter: blur(5px); 
            transition: all 0.5s ease; 
        }
        .gps-acquiring { border-color: #FFD700 !important; animation: gpsBlink 1s infinite; }
        .gps-good { border-color: #00FF88 !important; }
        .gps-warn { border-color: #FFD700 !important; }
        .gps-poor { border-color: #FF6B35 !important; }
        @keyframes gpsBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ==================== 影片系統 ==================== */
        #video-overlay { flex-direction: column; background: #000; position: relative; }
        #game-video { width: 100vw; height: 100vh; object-fit: cover; }
        #video-controls { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 101; 
        }
        #skip-video-btn { 
            padding: 12px 30px; background: rgba(255,255,255,0.2); color: white; 
            border: 2px solid white; border-radius: 8px; font-size: 16px; font-weight: bold; 
            cursor: pointer; backdrop-filter: blur(5px); 
        }

        #retry-btn {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            width: 220px; padding: 16px 30px; border: none; border-radius: 25px;
            font-size: 18px; font-weight: bold; cursor: pointer; z-index: 102;
            display: none; box-shadow: 0 6px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px); letter-spacing: 0.5px;
            animation: retryBtnEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes retryBtnEntrance {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.9); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }
        #retry-btn:active { transform: translateX(-50%) scale(0.96); }

        /* ==================== QR 掃描器 ==================== */
        #scanner-overlay { background: transparent; }
        #scanner-container { position: relative; width: 100%; height: 100%; }
        #scanner-frame { 
            position: absolute; width: 280px; height: 280px; top: 107px; left: 50%; 
            transform: translateX(-50%); border: 4px solid #00ffff; border-radius: 20px; 
            background: transparent; box-shadow: 0 0 0 9999px rgba(0,0,0,0.8), 0 0 16px #00ffff; 
            transition: border-color 0.3s ease; z-index: 10; 
        }
        #scanner-frame::before { 
            content: ''; position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; 
            border: 3px solid #00FFFF; border-radius: 50%; 
            transform: translate(-50%, -50%); animation: scannerPulse 2s infinite; 
        }
        @keyframes scannerPulse { 
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 
            50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.3); } 
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 
        }
        #scanner-instruction { 
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%); 
            width: 80%; font-size: 18px; line-height: 1.6; text-align: center; 
            color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.9); z-index: 11; 
        }
        #cancel-scan-btn { 
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); 
            padding: 12px 30px; background: rgba(255,255,255,0.2); color: white; 
            border: 2px solid white; border-radius: 8px; font-size: 16px; font-weight: bold; 
            cursor: pointer; backdrop-filter: blur(5px); z-index: 11; 
        }
        
        /* ==================== 問答系統 ==================== */
        #question-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 100; background: transparent; 
        }
        #question-overlay::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.25); backdrop-filter: blur(4px); z-index: 1; 
        }
        #question-container { position: relative; width: 100%; height: 100%; z-index: 2; }
        #quiz-panel-background { 
            position: absolute; top: 58px; left: 50%; transform: translateX(-50%); 
            width: 251px; height: 222px; background-image: url('quiz-panel.png'); 
            background-size: 100% 100%; background-repeat: no-repeat; background-color: transparent; 
            image-rendering: pixelated; z-index: 10; filter: drop-shadow(0 8px 25px rgba(0,0,0,0.4)); 
        }
        #question-text { 
            position: absolute; top: 58px; left: 50%; transform: translateX(-50%); 
            font-size: 13px; text-align: left; width: 180px; font-weight: bold; line-height: 1.5; 
            color: #333; text-shadow: 0 1px 2px rgba(255,255,255,0.7); 
            margin-top: 40px; margin-left: 30px; z-index: 12; 
        }
        #answer-buttons { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .answer-btn { 
            position: absolute; left: 50%; transform: translateX(-50%); pointer-events: auto; 
            width: 280px; height: 55px; font-size: 14px; padding: 0 10px; border: none; cursor: pointer; 
            background-image: url('button-blue.png'); background-size: 100% 100%; 
            background-repeat: no-repeat; background-color: transparent; image-rendering: pixelated; 
            color: #333; font-weight: bold; text-shadow: 0 1px 1px rgba(255,255,255,0.8); 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            line-height: 1.3; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); 
        }
        .answer-btn:active { transform: translateX(-50%) scale(0.98); }
        .answer-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: translateX(-50%); }
        .answer-btn:nth-child(1) { top: 300px; } 
        .answer-btn:nth-child(2) { top: 360px; } 
        .answer-btn:nth-child(3) { top: 420px; } 
        .answer-btn:nth-child(4) { top: 480px; }
        #feedback { 
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 300px; padding: 15px; border-radius: 10px; font-size: 15px; 
            font-weight: bold; white-space: pre-line; line-height: 1.6; text-align: center; 
            z-index: 20; backdrop-filter: blur(8px); 
        }
        #continue-btn { 
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); 
            width: 200px; padding: 12px 30px; 
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%); 
            color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(40,167,69,0.4); 
            z-index: 21; display: none; backdrop-filter: blur(5px); 
        }
        #continue-btn:active { transform: translateX(-50%) scale(0.98); }

        /* ==================== 除錯面板（隱藏保留）==================== */
        #debug-compass { 
            position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.92); color: #00FF00; 
            padding: 10px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 10px; 
            z-index: 9999; display: none; border: 2px solid #00FF00; min-width: 240px; 
            backdrop-filter: blur(10px); line-height: 1.5; 
        }
        #debug-compass .debug-title { color: #FFD700; font-weight: bold; font-size: 11px; margin-bottom: 4px; }
        #debug-compass .debug-section { color: #888; margin-top: 4px; border-top: 1px solid #333; padding-top: 2px; }
        #debug-compass div { margin: 1px 0; }
        #debug-compass span { color: #00FFFF; font-weight: bold; }
        .val-good { color: #00FF88 !important; } 
        .val-warn { color: #FFD700 !important; } 
        .val-bad { color: #FF4444 !important; }
    </style>
</head>
<body>

    <!-- 📷 主相機畫面 -->
    <video id="camera-view" autoplay muted playsinline></video>
    <canvas id="qr-canvas"></canvas>

    <!-- 🎵 音效元素 -->
    <audio id="scan-success-audio" src="scan_success.mp3" preload="auto"></audio>
    <audio id="navigation-sound-audio" src="navigation_sound.mp3" preload="auto"></audio>

    <!-- ⏱️ 計時器 -->
    <div id="timer-display">10:00</div>

    <!-- 🔼 導航箭頭與 GPS 指示 -->
    <div id="arrow-container"><div id="navigation-arrow"></div></div>
    <div id="gps-indicator">📡</div>

    <!-- 📌 底部狀態面板 -->
    <div id="status-panel" class="hidden">
        <div id="checkpoint-name"></div>
        <div id="distance-display"></div>
        <div id="instruction-text"></div>
        <button id="main-action-btn"></button>
    </div>

    <!-- 👋 歡迎畫面 -->
    <div id="welcome-screen" class="overlay">
        <div id="welcome-card">
            <div id="welcome-text-area">
                <h1 id="welcome-title"></h1>
                <p id="welcome-message"></p>
                <button id="start-game-btn" onclick="startGame()">開始我們的旅程！</button>
            </div>
        </div>
    </div>

    <!-- 🎬 影片覆蓋層 -->
    <div id="video-overlay" class="overlay hidden">
        <video id="game-video" playsinline>
            <source id="video-source" src="" type="video/mp4">
        </video>
        <div id="video-controls">
            <button id="skip-video-btn" onclick="skipVideo()"></button>
        </div>
        <button id="retry-btn" onclick="location.reload()">🔄 再試一次</button>
    </div>

    <!-- 🔍 掃描 QR 覆蓋層 -->
    <div id="scanner-overlay" class="overlay hidden">
        <div id="scanner-container">
            <div id="scanner-frame"></div>
            <p id="scanner-instruction"></p>
            <button id="cancel-scan-btn" onclick="cancelScanning()">取消</button>
        </div>
    </div>

    <!-- ❓ 問答覆蓋層 -->
    <div id="question-overlay" class="overlay hidden">
        <div id="question-container">
            <div id="quiz-panel-background"></div>
            <h2 id="question-text"></h2>
            <div id="answer-buttons"></div>
            <div id="feedback"></div>
            <button id="continue-btn" onclick="continueToNextCheckpoint()">繼續 ▶</button>
        </div>
    </div>

    <!-- 🧭 除錯面板（隱藏但保留程式碼）-->
    <div id="debug-compass">
        <div class="debug-title">🧭 雷達導航 v22.0</div>
        <div class="debug-section">── 羅盤 ──</div>
        <div>平滑方向: <span id="debug-heading">0</span>°</div>
        <div class="debug-section">── GPS ──</div>
        <div>精度: <span id="debug-acc">-</span></div>
        <div>穩定距離: <span id="debug-dist">-</span>m</div>
        <div class="debug-section">── 導航 ──</div>
        <div>目標方位: <span id="debug-target">-</span></div>
        <div>箭頭旋轉: <span id="debug-rotation">-</span>°</div>
        <div class="debug-section">── 計時器 ──</div>
        <div>剩餘秒數: <span id="debug-timer">-</span>s</div>
    </div>

    <script>
        const GAME_CONFIG = {
            general: {
                gameName: "香港浸會大學 李作權大道 AR 互動遊戲",
                welcomeTitle: "🎓 香港浸會大學\n李作權大道 AR 互動遊戲",
                welcomeMessage: "歡迎來到互動導航體驗！\n\n你將探索浸大的李作權大道，在步行的同時回答與環境氣候相關的問題並學習新知識 🔆。\n\n⏳ 注意：這是一場限時挑戰！請在時間結束前完成所有關卡。\n\n✅ 請在系統提示時，允許程式存取相機、動作及方向感應器。",
                completionTitle: "🎉 恭喜完成！",
                completionMessage: "你已成功在限時內完成香港浸會大學\n李作權大道 AR 互動導覽！"
            },
            
            timer: {
                limitSeconds: 600,
                warningThreshold: 60,
                winVideoPath: "winoutro.mp4",
                failVideoPath: "failedoutro.mp4"
            },
            
            video: {
                enableIntroVideo: true,
                introVideoPath: "chineseintro.mp4",
                transitionVideoPath: "updatedtransition.mp4",
                showSkipButton: true,
                skipButtonText: "跳過影片",
                autoPlayVideos: true
            },

            assets: {
                welcomeBackground: "welcome-bg.png", cardWidth: "87vw", cardMaxWidth: "400px",
                cardAspectRatio: "9 / 16", cardMaxHeight: "85vh", navigationArrow: "arrow.png",
                showWelcomeText: false, startButtonText: "開始我們的旅程！",
                scanSuccessSound: "scan_success.mp3",
                navigationSound: "navigation_sound.mp3"
            },
            
            appearance: {
                arrowSize: 130, primaryColor: "#00FFFF", buttonColor: "#00FFFF",
                scannerFrameColor: "#00FFFF", scannerErrorColor: "#FF3B30"
            },
            
            navigation: {
                proximityRadius: 30, hybridSwitchDistance: 25, gpsHighAccuracy: true,
                gpsMaxAge: 0, gpsTimeout: 8000, headingSmoothness: 0.08,
                minMovementThreshold: 2, magneticDeclination: -2.5,
                showDebugPanel: false
            },

            // 🔊 雷達音效距離配置（可調整）
            radarSound: {
                farDistance: 100,       // 超過此距離為遠距離模式
                mediumDistance: 50,     // 超過此距離為中距離模式
                closeDistance: 30,      // 超過此距離為近距離模式
                farInterval: 5000,      // 遠距離：每5秒
                mediumInterval: 3000,   // 中距離：每3秒
                closeInterval: 1000,    // 近距離：每1秒
                nearInterval: 500       // 接近模式：每0.5秒
            },
            
            behavior: {
                qrScanInterval: 500, scanErrorTimeout: 1500, incorrectAnswerDelay: 4000,
                correctAnswerBg: "rgba(212, 237, 218, 0.9)", correctAnswerText: "#155724",
                incorrectAnswerBg: "rgba(248, 215, 218, 0.9)", incorrectAnswerText: "#721c24"
            },
            
            originQR: { content: "HKBU_LI_PROMENADE_ORIGIN", lat: 22.337222, lng: 114.181944 },
            
            checkpoints: [
                {
                    name: "圖書館台階", qrCode: "HKBU_CP1", lat: 22.338333, lng: 114.182222, staticBearing: 350,
                    question: "哪種氣體是導致全球暖化主要的溫室氣體？",
                    answers: ["A. 氮氣 (N₂)", "B. 氧氣 (O₂)", "C. 二氧化碳 (CO₂)", "D. 氬氣 (Ar)"],
                    correctAnswerIndex: 2, hint: "這種氣體主要來自燃燒化石燃料（如汽車廢氣）以及我們的呼吸，植物則會吸收它。",
                    arrivalMessage: "📍 你已到達圖書館台階！"
                },
                {

        // ================================================================
        //              GPS 計算函式
        // ================================================================
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const λ1 = lon1 * Math.PI / 180, λ2 = lon2 * Math.PI / 180;
            const y = Math.sin(λ2 - λ1) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(λ2 - λ1);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function getStableDistance(newDistance) {
            distanceHistory.push(newDistance);
            if (distanceHistory.length > DISTANCE_HISTORY_SIZE) distanceHistory.shift();
            const sorted = [...distanceHistory].sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
        }

        function formatNumber(val) {
            return isFinite(val) ? Math.round(val) : '-';
        }

        // ================================================================

        function startGPSTracking() {
            if (!navigator.geolocation) return;
            const gpsEl = document.getElementById('gps-indicator');
            gpsEl.style.display = 'flex'; gpsEl.className = 'gps-acquiring'; gpsEl.textContent = '📡';

            watchPositionId = navigator.geolocation.watchPosition(onGPSSuccess, onGPSError, {
                enableHighAccuracy: GAME_CONFIG.navigation.gpsHighAccuracy,
                maximumAge: GAME_CONFIG.navigation.gpsMaxAge,
                timeout: GAME_CONFIG.navigation.gpsTimeout
            });
        }

        function onGPSSuccess(position) {
            const lat = position.coords.latitude, lng = position.coords.longitude;
            const accuracy = Math.round(position.coords.accuracy);
            hasGPSSignal = true; currentLat = lat; currentLng = lng; gpsAccuracy = accuracy;

            const gpsEl = document.getElementById('gps-indicator');
            if (accuracy < 25) { gpsEl.className = 'gps-good'; gpsEl.textContent = '📍'; }
            else if (accuracy < 50) { gpsEl.className = 'gps-warn'; gpsEl.textContent = '📍'; }
            else { gpsEl.className = 'gps-poor'; gpsEl.textContent = '⚠️'; }

            if (gameState !== 'navigating' || currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) return;

            const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            const rawDistance = calculateDistance(lat, lng, cp.lat, cp.lng);
            currentDistance = getStableDistance(rawDistance);

            if (lastMovementLat !== null && lastMovementLng !== null) {
                const movementDistance = calculateDistance(lat, lng, lastMovementLat, lastMovementLng);
                if (movementDistance >= GAME_CONFIG.navigation.minMovementThreshold) {
                    dynamicBearing = calculateBearing(lat, lng, cp.lat, cp.lng);
                    lastMovementLat = lat; lastMovementLng = lng;
                }
            } else {
                dynamicBearing = calculateBearing(lat, lng, cp.lat, cp.lng);
                lastMovementLat = lat; lastMovementLng = lng;
            }
            updateNavigationUI();
        }

        function onGPSError(error) {
            hasGPSSignal = false;
            const gpsEl = document.getElementById('gps-indicator');
            gpsEl.className = 'gps-poor'; gpsEl.textContent = '❌';
        }

        function stopGPSTracking() {
            if (watchPositionId && navigator.geolocation) {
                navigator.geolocation.clearWatch(watchPositionId); watchPositionId = null;
            }

        // ================================================================

            if (gameState !== 'navigating') return;

            const distEl = document.getElementById('distance-display');
            const instrEl = document.getElementById('instruction-text');

                else if (d > 50) { distEl.className = 'dist-medium'; instrEl.textContent = "繼續跟隨箭頭前進。"; }
                else { distEl.className = 'dist-close'; instrEl.textContent = "請跟隨箭頭前往目的地。"; }

        function updateNavigationArrow() {
            if (gameState !== 'navigating' || currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) return;

            const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            let targetBearing = 0, navMode = '備用';

            if (hasGPSSignal) {
                if (currentDistance > GAME_CONFIG.navigation.hybridSwitchDistance) {
                    targetBearing = dynamicBearing; navMode = 'GPS';
                } else {
                    targetBearing = cp.staticBearing || dynamicBearing; navMode = '精準';
                }
            } else {
                targetBearing = cp.staticBearing || 0;
            }

            targetBearing = (targetBearing + GAME_CONFIG.navigation.magneticDeclination + 360) % 360;
            let rotation = targetBearing - smoothedHeading;
            while (rotation > 180) rotation -= 360;
            while (rotation < -180) rotation += 360;

            document.getElementById('navigation-arrow').style.transform = `rotate(${rotation}deg)`;

            if (GAME_CONFIG.navigation.showDebugPanel) {
                document.getElementById('debug-heading').textContent = formatNumber(smoothedHeading);
                document.getElementById('debug-target').textContent = `${formatNumber(targetBearing)}° [${navMode}]`;

                document.getElementById('debug-dist').textContent = formatNumber(currentDistance);

        // ================================================================

        function startRenderLoop() {

                let diff = deviceHeading - smoothedHeading;

                smoothedHeading += diff * GAME_CONFIG.navigation.headingSmoothness;
                if (smoothedHeading < 0) smoothedHeading += 360;
                if (smoothedHeading >= 360) smoothedHeading -= 360;
                if (gameState === 'navigating' && currentCheckpointIndex < GAME_CONFIG.checkpoints.length) {

                animationFrameId = requestAnimationFrame(render);

        function updateRadarSound() {
            // 只在導航狀態下運作
            if (gameState !== 'navigating') {
                stopRadarSound();
                return;
            }

            const d = Math.round(currentDistance);
            const rs = GAME_CONFIG.radarSound;
            let targetZone = null;
            let intervalMs = null;

            // 根據距離決定音效區間和頻率
            if (d > rs.farDistance) {
                targetZone = 'far';
                intervalMs = rs.farInterval;       // 每5秒
            } else if (d > rs.mediumDistance) {
                targetZone = 'medium';
                intervalMs = rs.mediumInterval;    // 每3秒
            } else if (d > rs.closeDistance) {
                targetZone = 'close';
                intervalMs = rs.closeInterval;     // 每1秒
            } else {
                targetZone = 'near';
                intervalMs = rs.nearInterval;      // 每0.5秒
            }

            // 只有區間改變時才重設，避免不必要的中斷
            if (currentSoundZone !== targetZone) {
                stopRadarSound();
                currentSoundZone = targetZone;

                // 立即播放一次，再設定定期播放
                playNavigationSound();
                navigationSoundInterval = setInterval(playNavigationSound, intervalMs);

                console.log(`🔊 音效區間切換：${targetZone}（每 ${intervalMs}ms）`);
            }
        }

        function stopRadarSound() {
            if (navigationSoundInterval) {
                clearInterval(navigationSoundInterval);
                navigationSoundInterval = null;
            }
            currentSoundZone = null;
        }

            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') { alert('🧭 導航需要羅盤權限，請允許存取！'); return; }
                }

                window.addEventListener('deviceorientation', handleOrientationChange, true);
                window.addEventListener('deviceorientationabsolute', handleOrientationChange, true);

                initAudio();

                await startCameraStream(); startGPSTracking(); startRenderLoop();
                hideOverlay('welcome-screen');
                GAME_CONFIG.video.enableIntroVideo ? playIntroVideo() : promptOriginScan();
            } catch(e) { alert('無法啟動遊戲，請允許相機及動作感應器權限。'); }
        }

        // ================================================================

        function startQRScanning() {

            isScanning = true; hideStatusPanel();
            document.getElementById('arrow-container').style.display = 'none';
            showOverlay('scanner-overlay'); resetScannerAppearance();

            if (gameState === 'scanOrigin') {
                document.getElementById('scanner-instruction').textContent = '請掃描起點二維碼';
            } else if (gameState === 'scanCheckpoint') {
                const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                document.getElementById('scanner-instruction').textContent = `請掃描「${checkpoint.name}」的二維碼`;
            }
            scanningInterval = setInterval(scanForQRCode, GAME_CONFIG.behavior.qrScanInterval);
        }

        function scanForQRCode() {
            const video = document.getElementById('camera-view'), canvas = document.getElementById('qr-canvas'), ctx = canvas.getContext('2d');
            if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            try {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const qr = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
                if (qr && qr.data) { stopScanning(); handleQRCodeDetected(qr.data); }
            } catch(e) { console.error('QR錯誤:', e); }
        }

        function stopScanning() {
            isScanning = false;
            if (scanningInterval) { clearInterval(scanningInterval); scanningInterval = null; }
        }

        function cancelScanning() {
            stopScanning(); hideOverlay('scanner-overlay');
            if (gameState === 'scanOrigin') {
                promptOriginScan();
            } else if (gameState === 'scanCheckpoint') {
                gameState = 'navigating'; showStatusPanel();
                if (currentDistance > GAME_CONFIG.navigation.proximityRadius) {
                    document.getElementById('arrow-container').style.display = 'block';
                }
                updateNavigationUI();
            }
        }

        function resetScannerAppearance() {
            document.getElementById('scanner-frame').style.borderColor = GAME_CONFIG.appearance.scannerFrameColor;
            document.getElementById('scanner-instruction').style.color = 'white';
        }

        // ================================================================
        //              QR 掃描結果處理
        // ================================================================
        function handleQRCodeDetected(content) {
            if (gameState === 'scanOrigin') {
                if (content === GAME_CONFIG.originQR.content) {
                    hideOverlay('scanner-overlay');
                    startTimer();
                    setTimeout(startNavigationToCheckpoint, 500);
                } else {
                    document.getElementById('scanner-instruction').textContent = '❌ 二維碼錯誤！請掃描起點標記';
                    document.getElementById('scanner-instruction').style.color = GAME_CONFIG.appearance.scannerErrorColor;
                    setTimeout(() => { resetScannerAppearance(); startQRScanning(); }, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            } else if (gameState === 'scanCheckpoint') {
                const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                if (content === cp.qrCode) {
                    playScanSuccessSound();
                    hideOverlay('scanner-overlay');
                    setTimeout(showQuestion, 500);
                } else {
                    document.getElementById('scanner-instruction').textContent = `❌ 二維碼錯誤！請掃描「${cp.name}」`;
                    document.getElementById('scanner-instruction').style.color = GAME_CONFIG.appearance.scannerErrorColor;
                    setTimeout(() => { resetScannerAppearance(); startQRScanning(); }, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            }
        }

        // ================================================================
        //              導航流程
        // ================================================================
        function promptOriginScan() {
            gameState = 'scanOrigin'; showStatusPanel();
            document.getElementById('arrow-container').style.display = 'none';
            document.getElementById('checkpoint-name').textContent = '歡迎來到李作權大道！';
            document.getElementById('distance-display').textContent = '';
            document.getElementById('instruction-text').textContent = '若要開啟你的限時挑戰，請掃描位於起點處的二維碼 📍';
            const btn = document.getElementById('main-action-btn');
            btn.textContent = '掃描起點二維碼'; btn.disabled = false; btn.onclick = startQRScanning;
            btn.classList.remove('scan-ready');
        }

        function startNavigationToCheckpoint() {
            if (currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) { triggerGameWin(); return; }

            gameState = 'navigating';
            distanceHistory = []; lastMovementLat = null; lastMovementLng = null; currentDistance = 9999;

            showStatusPanel();
            document.getElementById('arrow-container').style.display = 'block';
            document.getElementById('arrow-container').style.opacity = '1';
            document.getElementById('checkpoint-name').textContent = `導航至：${GAME_CONFIG.checkpoints[currentCheckpointIndex].name}`;
            document.getElementById('distance-display').textContent = '正在定位…';
            document.getElementById('distance-display').className = 'dist-far';
            document.getElementById('instruction-text').textContent = '請跟隨箭頭前往目的地。';

            const btn = document.getElementById('main-action-btn');
            btn.textContent = '我已到達'; btn.disabled = false; btn.classList.remove('scan-ready');
            btn.onclick = function() { gameState = 'scanCheckpoint'; startQRScanning(); };
        }

        // ================================================================
        //              問答系統
        // ================================================================
        function showQuestion() {
            stopRadarSound(); // 🔊 進入問答模式時停止雷達音效
            gameState = 'question'; hideStatusPanel();
            document.getElementById('arrow-container').style.display = 'none';
            document.getElementById('gps-indicator').style.display = 'none';

            const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            document.getElementById('question-text').textContent = cp.question;
            const container = document.getElementById('answer-buttons'); container.innerHTML = '';
            cp.answers.forEach((ans, i) => {
                const btn = document.createElement('button'); btn.className = 'answer-btn';
                btn.textContent = ans; btn.onclick = () => checkAnswer(i); container.appendChild(btn);
            });
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').style.background = '';
            document.getElementById('continue-btn').style.display = 'none';
            showOverlay('question-overlay');
        }

        function checkAnswer(idx) {
            const cp = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            const fb = document.getElementById('feedback');
            document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
            if (idx === cp.correctAnswerIndex) {
                fb.textContent = '✅ 答對了！做得好！';
                fb.style.background = GAME_CONFIG.behavior.correctAnswerBg;
                fb.style.color = GAME_CONFIG.behavior.correctAnswerText;
                fb.style.border = `2px solid ${GAME_CONFIG.behavior.correctAnswerText}`;
                document.getElementById('continue-btn').style.display = 'block';
            } else {
                fb.textContent = `❌ 答錯了，請再試一次。\n\n💡 提示：${cp.hint}`;
                fb.style.background = GAME_CONFIG.behavior.incorrectAnswerBg;
                fb.style.color = GAME_CONFIG.behavior.incorrectAnswerText;
                fb.style.border = `2px solid ${GAME_CONFIG.behavior.incorrectAnswerText}`;
                setTimeout(() => {
                    fb.textContent = ''; fb.style.background = ''; fb.style.border = '';
                    document.querySelectorAll('.answer-btn').forEach(b => b.disabled = false);
                }, GAME_CONFIG.behavior.incorrectAnswerDelay);
            }
        }

        function continueToNextCheckpoint() {
            hideOverlay('question-overlay');
            currentCheckpointIndex++;

            // 如果還有下一個檢查點，播放過場影片；否則觸發勝利
            if (currentCheckpointIndex < GAME_CONFIG.checkpoints.length) {
                playTransitionVideo();
            } else {
                startNavigationToCheckpoint(); // 觸發遊戲勝利
            }
        }

        // ================================================================
        //              遊戲結局系統
        // ================================================================
        function triggerGameWin() {
            stopRadarSound(); // 🔊 勝利時停止雷達音效
            hideTimer(); hideAllOverlays();
            document.getElementById('arrow-container').style.display = 'none';
            document.getElementById('gps-indicator').style.display = 'none';
            playOutroVideo(true);
        }

        function triggerGameFailed() {
            stopRadarSound(); // 🔊 失敗時停止雷達音效
            hideTimer(); stopScanning(); hideAllOverlays();
            document.getElementById('arrow-container').style.display = 'none';
            document.getElementById('gps-indicator').style.display = 'none';
            playOutroVideo(false);
        }

        // ================================================================
        //              配置應用
        // ================================================================
        function applyConfiguration() {
            const cfg = GAME_CONFIG;
            const card = document.getElementById('welcome-card');
            card.style.backgroundImage = `url('${cfg.assets.welcomeBackground}')`;
            card.style.width = cfg.assets.cardWidth; card.style.maxWidth = cfg.assets.cardMaxWidth;
            card.style.aspectRatio = cfg.assets.cardAspectRatio; card.style.maxHeight = cfg.assets.cardMaxHeight;

            const titleEl = document.getElementById('welcome-title'), msgEl = document.getElementById('welcome-message');
            if (!cfg.assets.showWelcomeText) {
                titleEl.style.display = 'none'; msgEl.style.display = 'none';
            } else {
                titleEl.textContent = cfg.general.welcomeTitle; titleEl.style.color = cfg.appearance.primaryColor;
                msgEl.textContent = cfg.general.welcomeMessage;
            }

            const gradient = `linear-gradient(135deg, ${cfg.appearance.buttonColor} 0%, ${cfg.appearance.buttonColor}DD 100%)`;
            document.getElementById('start-game-btn').textContent = cfg.assets.startButtonText;
            document.getElementById('start-game-btn').style.background = gradient;
            document.getElementById('main-action-btn').style.background = gradient;

            const arrowContainer = document.getElementById('arrow-container');
            arrowContainer.style.width = cfg.appearance.arrowSize + 'px';
            arrowContainer.style.height = cfg.appearance.arrowSize + 'px';
            document.getElementById('navigation-arrow').style.backgroundImage = `url('${cfg.assets.navigationArrow}')`;

            document.getElementById('status-panel').style.borderTopColor = cfg.appearance.primaryColor;
            document.getElementById('checkpoint-name').style.color = cfg.appearance.primaryColor;
            document.getElementById('skip-video-btn').textContent = cfg.video.skipButtonText;
            if (!cfg.video.showSkipButton) document.getElementById('skip-video-btn').style.display = 'none';

            const mins = Math.floor(cfg.timer.limitSeconds / 60);
            const secs = cfg.timer.limitSeconds % 60;
            document.getElementById('timer-display').textContent =
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // ================================================================
        //              UI 輔助函式
        // ================================================================
        function showOverlay(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideOverlay(id) { document.getElementById(id).classList.add('hidden'); }
        function showStatusPanel() { document.getElementById('status-panel').classList.remove('hidden'); }
        function hideStatusPanel() { document.getElementById('status-panel').classList.add('hidden'); }
        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => {
                if (o.id !== 'welcome-screen') o.classList.add('hidden');
            });
        }

        // 除錯面板控制（隱藏但保留邏輯）
        setInterval(() => {
            document.getElementById('debug-compass').style.display =
                (GAME_CONFIG.navigation.showDebugPanel && gameState === 'navigating') ? 'block' : 'none';
        }, 500);

        window.addEventListener('beforeunload', () => {
            stopCameraStream(); stopScanning(); stopGPSTracking(); hideTimer(); stopRadarSound();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyConfiguration();
            console.log('🚀 HKBU AR Game v22.0 - 雷達導航音效系統');
        });
    </script>
</body>
</html>

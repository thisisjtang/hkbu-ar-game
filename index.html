<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HKBU Li Promenade AR Guide</title>
    
    <!-- QR Code Scanner Library -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <style>
        /* ==================== BASE STYLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }
        
        /* ==================== CAMERA LAYER ==================== */
        #camera-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        
        #qr-canvas {
            display: none;
        }
        
        /* ==================== UI LAYERS ==================== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
        }
        
        .hidden {
            display: none !important;
        }
        
        /* ==================== NAVIGATION ARROW ==================== */
        #arrow-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            display: none;
            pointer-events: none;
            animation: arrowPulse 2s ease-in-out infinite;
        }
        
        #navigation-arrow {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 0% 70%, 30% 70%, 30% 100%, 70% 100%, 70% 70%, 100% 70%);
            transition: transform 0.3s ease-out;
        }
        
        @keyframes arrowPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }
        
        /* ==================== STATUS PANEL ==================== */
        #status-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(10px);
            color: white;
            padding: 25px 20px;
            z-index: 20;
        }
        
        #checkpoint-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }
        
        #distance-display {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        #instruction-text {
            font-size: 15px;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.5;
            color: #CCCCCC;
            white-space: pre-line;
        }
        
        #main-action-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 15px 30px;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #main-action-btn:active {
            transform: scale(0.98);
        }
        
        /* ==================== WELCOME SCREEN ==================== */
        #welcome-screen {
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            text-align: center;
            padding: 40px 30px;
        }
        
        #welcome-screen h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        #welcome-screen p {
            color: white;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            white-space: pre-line;
        }
        
        #start-game-btn {
            padding: 18px 40px;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* ==================== VIDEO PLAYER ==================== */
        #video-overlay {
            flex-direction: column;
            background: #000;
        }
        
        #game-video {
            max-width: 100%;
            max-height: 80vh;
            width: 100%;
        }
        
        #video-controls {
            margin-top: 20px;
            text-align: center;
        }
        
        #skip-video-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* ==================== QR SCANNER (REVERTED TO ORIGINAL CYAN BORDER) ==================== */
        #scanner-container {
            text-align: center;
            color: white;
        }
        
        #scanner-frame {
            /* Applied your measurements from the editor */
            width: 292px;
            height: 373px;
            
            /* Reverted to original cyan border style - NO corner frames */
            border: 4px solid #00FFFF;
            border-radius: 20px;
            margin: 0 auto 30px;
            position: relative;
            background: transparent;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            transition: border-color 0.3s ease;
        }
        
        #scanner-frame::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border: 3px solid #00FFFF;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: scanPulse 2s infinite;
        }
        
        @keyframes scanPulse {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        #scanner-instruction {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.5;
            transition: color 0.3s ease;
        }
        
        #cancel-scan-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* ==================== CUSTOM QUESTION PANEL WITH YOUR MEASUREMENTS ==================== */
        #question-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            background: rgba(0, 0, 0, 0.95);
        }
        
        #question-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        /* Quiz Panel Background with Corner Frames */
        #quiz-panel-background {
            position: absolute;
            top: 58px;  /* From your editor positioning */
            left: 50%;
            transform: translateX(-50%);
            
            /* Applied your exact measurements */
            width: 251px;
            height: 222px;
            
            /* Main quiz panel image */
            background-image: url('quiz-panel.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: transparent;
            image-rendering: pixelated;
            
            z-index: 10;
        }
        
        /* Corner frames decoration for quiz panel */
        .quiz-corner {
            position: absolute;
            width: 50px;
            height: 50px;
            background-image: url('corner-frame.png');
            background-size: contain;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            z-index: 11;
        }
        
        .quiz-corner-tl { top: -15px; left: -15px; transform: rotate(0deg); }
        .quiz-corner-tr { top: -15px; right: -15px; transform: rotate(90deg); }
        .quiz-corner-bl { bottom: -15px; left: -15px; transform: rotate(-90deg); }
        .quiz-corner-br { bottom: -15px; right: -15px; transform: rotate(180deg); }
        
        /* Question text positioned inside the pink panel area */
        #question-text {
            position: absolute;
            top: 58px;  /* Aligned with panel top */
            left: 50%;
            transform: translateX(-50%);
            width: 200px;  /* Fits within panel width, avoiding BMO character */
            
            font-size: 15px;
            font-weight: bold;
            line-height: 1.4;
            color: #333;
            text-align: center;
            text-shadow: 0 1px 2px rgba(255,255,255,0.7);
            
            /* Position text in the right area of the pink panel */
            margin-top: 40px;
            margin-left: 30px;
            
            z-index: 12;
        }
        
        /* Answer buttons positioned based on your editor measurements */
        #answer-buttons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .answer-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            
            /* Applied your exact measurements */
            width: 280px;
            height: 55px;
            
            padding: 0;
            border: none;
            cursor: pointer;
            
            /* Your custom button background */
            background-image: url('button-blue.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: transparent;
            image-rendering: pixelated;
            
            /* Text styling */
            color: #333;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 1px 1px rgba(255,255,255,0.8);
            
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        
        .answer-btn:active {
            transform: translateX(-50%) scale(0.98);
        }
        
        .answer-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translateX(-50%);
        }
        
        /* Button positioning from your editor measurements */
        .answer-btn:nth-child(1) { top: 300px; }
        .answer-btn:nth-child(2) { top: 360px; }
        .answer-btn:nth-child(3) { top: 420px; }
        .answer-btn:nth-child(4) { top: 480px; }
        
        /* Feedback message */
        #feedback {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 300px;
            
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            white-space: pre-line;
            line-height: 1.5;
            text-align: center;
            z-index: 20;
        }
        
        /* ==================== DEBUG PANEL ==================== */
        #debug-compass {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #00FF00;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            z-index: 9999;
            display: none;
            border: 2px solid #00FF00;
            min-width: 200px;
        }
        
        #debug-compass div {
            margin: 4px 0;
        }
        
        #debug-compass span {
            color: #00FFFF;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <!-- ================================================================= -->
    <!--                    UNITY-STYLE INSPECTOR                          -->
    <!--                   CUSTOMIZE YOUR GAME HERE                        -->
    <!-- ================================================================= -->
    <script>
        const GAME_CONFIG = {
            // ==================== GENERAL SETTINGS ====================
            general: {
                gameName: "HKBU Li Promenade AR Guide",
                welcomeTitle: "🎓 HKBU Li Promenade AR Guide",

                    ],
                    correctAnswerIndex: 1,
                    hint: "HKBU emphasizes developing both academic knowledge and personal character.",
                    arrivalMessage: "You've reached the Student Center!"
                },
                {
                    name: "Academic Building",
                    qrCode: "HKBU_CP3", 
                    bearing: 270,
                    distance: 35,
                    question: "Which school is HKBU particularly well-known for?",
                    answers: [
                        "School of Medicine",
                        "School of Communication",
                        "School of Law",
                        "School of Agriculture"

                    correctAnswerIndex: 1,
                    hint: "HKBU has a strong reputation in media and journalism programs.",
                    arrivalMessage: "Welcome to the Academic Building!"
                }
            ]
        };
    </script>
    <!-- ================================================================= -->
    
    
    <!-- Camera Stream Background -->
    <video id="camera-view" autoplay muted playsinline></video>
    <canvas id="qr-canvas"></canvas>
    
    <!-- Navigation Arrow -->
    <div id="arrow-container">
        <div id="navigation-arrow"></div>
    </div>
    
    <!-- Status Panel -->
    <div id="status-panel" class="hidden">
        <div id="checkpoint-name"></div>
        <div id="distance-display"></div>
        <div id="instruction-text"></div>
        <button id="main-action-btn"></button>
    </div>
    
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="overlay">
        <div>
            <h1 id="welcome-title"></h1>
            <p id="welcome-message"></p>
            <button id="start-game-btn" onclick="startGame()">Start Adventure</button>
        </div>
    </div>
    
    <!-- Video Player -->
    <div id="video-overlay" class="overlay hidden">
        <video id="game-video" controls playsinline>
            <source id="video-source" src="" type="video/mp4">
        </video>
        <div id="video-controls">
            <button id="skip-video-btn" onclick="skipVideo()"></button>
        </div>
    </div>
    
    <!-- QR Scanner Overlay (Original Cyan Border Style) -->
    <div id="scanner-overlay" class="overlay hidden">
        <div id="scanner-container">
            <div id="scanner-frame"></div>
            <p id="scanner-instruction"></p>
            <button id="cancel-scan-btn" onclick="cancelScanning()">Cancel</button>
        </div>
    </div>
    
    <!-- Question Overlay with Custom Panel and Corner Frames -->
    <div id="question-overlay" class="overlay hidden">
        <div id="question-container">
            <!-- Quiz Panel Background with Corner Frames -->
            <div id="quiz-panel-background">
                <div class="quiz-corner quiz-corner-tl"></div>
                <div class="quiz-corner quiz-corner-tr"></div>
                <div class="quiz-corner quiz-corner-bl"></div>
                <div class="quiz-corner quiz-corner-br"></div>
            </div>
            
            <!-- Question Text -->
            <h2 id="question-text"></h2>
            
            <!-- Answer Buttons -->
            <div id="answer-buttons"></div>
            
            <!-- Feedback Message -->
            <div id="feedback"></div>
        </div>
    </div>
    
    <!-- Debug Panel -->
    <div id="debug-compass">
        <div>🧭 Compass Debug</div>
        <div>Heading: <span id="debug-heading">0</span>°</div>
        <div>Updates: <span id="debug-count">0</span></div>
        <div>State: <span id="debug-state">-</span></div>
        <div>Target: <span id="debug-target">-</span>°</div>
        <div>Rotation: <span id="debug-rotation">0</span>°</div>
    </div>

    <script>
        // ============================================
        // GAME STATE VARIABLES
        // ============================================
        let gameState = 'welcome';
        let currentCheckpointIndex = 0;
        let deviceHeading = 0;
        let isOriginSet = false;
        let videoStream = null;
        let scanningInterval = null;
        let isScanning = false;
        let compassUpdateCount = 0;
        
        // ============================================
        // INITIALIZATION AND CONFIGURATION
        // ============================================
        function applyConfiguration() {
            const config = GAME_CONFIG;
            
            // Apply visual styling for arrow
            const arrow = document.getElementById('navigation-arrow');
            const arrowContainer = document.getElementById('arrow-container');
            
            arrow.style.background = `linear-gradient(135deg, ${config.appearance.arrowColor} 0%, ${config.appearance.arrowColor}DD 100%)`;
            arrow.style.filter = `drop-shadow(0 0 ${config.appearance.arrowGlowIntensity}px ${config.appearance.arrowColor})`;
            arrowContainer.style.width = config.appearance.arrowSize + 'px';
            arrowContainer.style.height = config.appearance.arrowSize + 'px';
            
            // Apply UI colors
            document.getElementById('status-panel').style.borderTopColor = config.appearance.primaryColor;
            document.getElementById('checkpoint-name').style.color = config.appearance.primaryColor;
            
            // Welcome screen
            document.getElementById('welcome-title').textContent = config.general.welcomeTitle;
            document.getElementById('welcome-title').style.color = config.appearance.primaryColor;
            document.getElementById('welcome-message').textContent = config.general.welcomeMessage;
            
            // Buttons
            const startBtn = document.getElementById('start-game-btn');
            const actionBtn = document.getElementById('main-action-btn');
            
            startBtn.style.background = `linear-gradient(135deg, ${config.appearance.buttonColor} 0%, ${config.appearance.buttonColor}DD 100%)`;
            startBtn.style.boxShadow = `0 6px 20px ${config.appearance.buttonColor}80`;
            
            actionBtn.style.background = `linear-gradient(135deg, ${config.appearance.buttonColor} 0%, ${config.appearance.buttonColor}DD 100%)`;
            actionBtn.style.boxShadow = `0 4px 15px ${config.appearance.buttonColor}66`;
            
            // Video controls
            document.getElementById('skip-video-btn').textContent = config.video.skipButtonText;
            if (!config.video.showSkipButton) {
                document.getElementById('skip-video-btn').style.display = 'none';
            }
            
            console.log('✓ Configuration with custom measurements applied');
        }
        
        // ============================================
        // GAME INITIALIZATION
        // ============================================
        async function startGame() {
            console.log('🎮 Starting game...');
            
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && 
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    
                    console.log('📱 Requesting motion permission for iOS...');
                    
                    const permission = await DeviceOrientationEvent.requestPermission();
                    console.log('Motion permission result:', permission);
                    
                    if (permission !== 'granted') {
                        alert('🧭 Compass permission is REQUIRED for navigation!\n\nPlease:\n1. Reload the page\n2. Tap "Allow" when prompted\n3. Check Settings → Safari → Motion & Orientation Access');
                        return;
                    }
                }
                
                console.log('🧭 Setting up compass listeners...');
                
                window.addEventListener('deviceorientation', handleOrientationChange, true);
                window.addEventListener('deviceorientationabsolute', handleOrientationChange, true);
                
                setTimeout(() => {
                    console.log('Current device heading:', Math.round(deviceHeading), '°');
                    if (deviceHeading === 0 && compassUpdateCount === 0) {
                        console.warn('⚠️ Compass may not be working - check permissions and calibration');
                        alert('⚠️ Compass not detected!\n\nPlease:\n1. Open iPhone Compass app\n2. Calibrate by moving phone in figure-8\n3. Return to this game');
                    }
                }, 2000);
                
                console.log('📷 Requesting camera access...');
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                const videoElement = document.getElementById('camera-view');
                videoElement.srcObject = videoStream;
                
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = resolve;
                });
                
                console.log('✓ All permissions granted, starting game');
                
                hideOverlay('welcome-screen');
                
                if (GAME_CONFIG.video.enableIntroVideo) {
                    playIntroVideo();
                } else {
                    promptOriginScan();
                }
                
            } catch (error) {
                console.error('❌ Startup error:', error);
                alert('Unable to start game. Please:\n\n1. Use Safari browser (not Chrome)\n2. Allow camera permission\n3. Allow motion permission\n4. Check iPhone settings\n5. Try again');
            }
        }
        
        // ============================================
        // VIDEO SYSTEM
        // ============================================
        function playIntroVideo() {
            console.log('🎬 Playing intro video');
            gameState = 'introVideo';
            
            const videoElement = document.getElementById('game-video');
            const videoSource = document.getElementById('video-source');
            
            videoSource.src = GAME_CONFIG.video.introVideoPath;
            videoElement.load();
            
            if (GAME_CONFIG.video.autoPlayVideos) {
                videoElement.play().catch(err => {
                    console.log('Autoplay prevented, user must click play');
                });
            }
            
            videoElement.onended = () => {
                hideOverlay('video-overlay');
                promptOriginScan();
            };
            
            showOverlay('video-overlay');
        }
        
        function playOutroVideo() {
            console.log('🎬 Playing outro video');
            gameState = 'outroVideo';
            
            const videoElement = document.getElementById('game-video');
            const videoSource = document.getElementById('video-source');
            
            videoSource.src = GAME_CONFIG.video.outroVideoPath;
            videoElement.load();
            
            if (GAME_CONFIG.video.autoPlayVideos) {
                videoElement.play().catch(err => {
                    console.log('Autoplay prevented, user must click play');
                });
            }
            
            videoElement.onended = () => {
                hideOverlay('video-overlay');
                gameComplete();
            };
            
            showOverlay('video-overlay');
        }
        
        function skipVideo() {
            const videoElement = document.getElementById('game-video');
            videoElement.pause();
            hideOverlay('video-overlay');
            
            if (gameState === 'introVideo') {
                promptOriginScan();
            } else if (gameState === 'outroVideo') {
                gameComplete();
            }
        }
        
        // ============================================
        // COMPASS HANDLING
        // ============================================
        function handleOrientationChange(event) {
            compassUpdateCount++;
            let newHeading = null;
            
            if (event.webkitCompassHeading !== undefined) {
                newHeading = event.webkitCompassHeading;
            } 
            else if (event.alpha !== null) {
                if (event.absolute) {
                    newHeading = 360 - event.alpha;
                } else {
                    newHeading = 360 - event.alpha;
                }
            }
            
            if (newHeading !== null) {
                const smoothingFactor = GAME_CONFIG.behavior.arrowSmoothness;
                let diff = newHeading - deviceHeading;
                
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                
                deviceHeading += diff * smoothingFactor;
                
                if (deviceHeading < 0) deviceHeading += 360;
                if (deviceHeading >= 360) deviceHeading -= 360;
                
                if (compassUpdateCount % 30 === 0) {
                    console.log('🧭 Compass update:', Math.round(deviceHeading), '°');
                }
                
                if (gameState === 'navigating') {
                    updateNavigationArrow();
                }
            }
        }
        
        // ============================================
        // QR SCANNING SYSTEM
        // ============================================
        function startQRScanning() {
            if (isScanning) {
                console.log('Already scanning, ignoring duplicate call');
                return;
            }
            
            isScanning = true;
            console.log('📷 Starting QR scan for state:', gameState);
            
            showOverlay('scanner-overlay');
            resetScannerAppearance();
            
            if (gameState === 'scanOrigin') {
                document.getElementById('scanner-instruction').textContent = 'Scan the ORIGIN QR code to set your starting point';
            } else if (gameState === 'scanCheckpoint') {
                const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                document.getElementById('scanner-instruction').textContent = `Scan the QR code for: ${checkpoint.name}`;
            }
            
            scanningInterval = setInterval(scanForQRCode, GAME_CONFIG.behavior.qrScanInterval);
        }
        
        function scanForQRCode() {
            const video = document.getElementById('camera-view');
            const canvas = document.getElementById('qr-canvas');
            const context = canvas.getContext('2d');
            
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                return;
            }
            
            try {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const qrCode = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert"
                });
                
                if (qrCode && qrCode.data) {
                    console.log('✓ QR Code detected:', qrCode.data);
                    stopScanning();
                    handleQRCodeDetected(qrCode.data);
                }
            } catch (error) {
                console.error('QR scanning error:', error);
            }
        }
        
        function stopScanning() {
            console.log('Stopping QR scanner');
            isScanning = false;
            
            if (scanningInterval) {
                clearInterval(scanningInterval);
                scanningInterval = null;
            }
        }
        
        function cancelScanning() {
            stopScanning();
            hideOverlay('scanner-overlay');
            
            if (gameState === 'scanOrigin') {
                promptOriginScan();
            } else if (gameState === 'scanCheckpoint') {
                showStatusPanel();
            }
        }
        
        function resetScannerAppearance() {
            const frame = document.getElementById('scanner-frame');
            const instruction = document.getElementById('scanner-instruction');
            
            frame.style.borderColor = GAME_CONFIG.appearance.scannerFrameColor;
            instruction.style.color = 'white';
        }
        
        function showScannerError(message) {
            const frame = document.getElementById('scanner-frame');
            const instruction = document.getElementById('scanner-instruction');
            
            frame.style.borderColor = GAME_CONFIG.appearance.scannerErrorColor;
            instruction.style.color = GAME_CONFIG.appearance.scannerErrorColor;
            instruction.textContent = message;
        }
        
        function handleQRCodeDetected(qrContent) {
            console.log('Handling QR code:', qrContent, 'in state:', gameState);
            
            if (gameState === 'scanOrigin') {
                if (qrContent === GAME_CONFIG.originQR.content) {
                    console.log('✓ Origin QR matched!');
                    hideOverlay('scanner-overlay');
                    isOriginSet = true;
                    
                    setTimeout(() => {
                        startNavigationToCheckpoint();
                    }, 500);
                } else {
                    console.log('❌ Wrong origin QR:', qrContent);
                    showScannerError('❌ Wrong QR Code! Scan the ORIGIN marker');
                    
                    setTimeout(() => {
                        resetScannerAppearance();
                        startQRScanning();
                    }, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            } else if (gameState === 'scanCheckpoint') {
                const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
                const expectedQR = checkpoint.qrCode;
                
                if (qrContent === expectedQR) {
                    console.log('✓ Checkpoint QR matched!');
                    hideOverlay('scanner-overlay');
                    
                    setTimeout(() => {
                        showQuestion();
                    }, 500);
                } else {
                    console.log('❌ Wrong checkpoint QR');
                    showScannerError(`❌ Wrong QR! Scan code for: ${checkpoint.name}`);
                    
                    setTimeout(() => {
                        resetScannerAppearance();
                        startQRScanning();
                    }, GAME_CONFIG.behavior.scanErrorTimeout);
                }
            }
        }
        
        // ============================================
        // NAVIGATION SYSTEM
        // ============================================
        function promptOriginScan() {
            gameState = 'scanOrigin';
            console.log('Prompting origin scan');
            
            showStatusPanel();
            document.getElementById('checkpoint-name').textContent = 'Welcome to HKBU Li Promenade!';
            document.getElementById('distance-display').textContent = '';
            document.getElementById('instruction-text').textContent = 'To begin your journey, please scan the ORIGIN QR code located at the starting point.';
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = 'Scan Origin QR Code';
            btn.onclick = startQRScanning;
        }
        
        function startNavigationToCheckpoint() {
            if (currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) {
                if (GAME_CONFIG.video.enableOutroVideo) {
                    playOutroVideo();
                } else {
                    gameComplete();
                }
                return;
            }
            
            gameState = 'navigating';
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            
            console.log('🧭 Starting navigation to:', checkpoint.name);
            
            showStatusPanel();
            document.getElementById('arrow-container').style.display = 'block';
            
            document.getElementById('checkpoint-name').textContent = `Navigate to: ${checkpoint.name}`;
            
            if (GAME_CONFIG.behavior.showDistance) {
                document.getElementById('distance-display').textContent = `~${checkpoint.distance}m away`;
            } else {
                document.getElementById('distance-display').textContent = '';
            }
            
            document.getElementById('instruction-text').textContent = `Follow the blue arrow to reach your destination.\n\nWhen you arrive, tap "I've Arrived".`;
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = "I've Arrived";
            btn.onclick = promptCheckpointScan;
            
            updateNavigationArrow();
        }
        
        function updateNavigationArrow() {
            if (gameState !== 'navigating' || currentCheckpointIndex >= GAME_CONFIG.checkpoints.length) {
                return;
            }
            
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            const targetBearing = checkpoint.bearing;
            
            let rotation = targetBearing - deviceHeading;
            
            while (rotation > 180) rotation -= 360;
            while (rotation < -180) rotation += 360;
            
            const arrow = document.getElementById('navigation-arrow');
            arrow.style.transform = `rotate(${rotation}deg)`;
            
            document.getElementById('debug-target').textContent = targetBearing;
            document.getElementById('debug-rotation').textContent = Math.round(rotation);
        }
        
        function promptCheckpointScan() {
            gameState = 'scanCheckpoint';
            
            console.log('Prompting checkpoint scan');
            
            document.getElementById('arrow-container').style.display = 'none';
            
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            
            document.getElementById('checkpoint-name').textContent = checkpoint.arrivalMessage || `Great! You've reached:`;
            document.getElementById('distance-display').textContent = checkpoint.name;
            document.getElementById('instruction-text').textContent = 'Now scan the checkpoint QR code to answer the question.';
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = 'Scan Checkpoint QR';
            btn.onclick = startQRScanning;
        }
        
        // ============================================
        // QUESTION SYSTEM WITH CUSTOM GRAPHICS
        // ============================================
        function showQuestion() {
            gameState = 'question';
            hideStatusPanel();
            
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            
            console.log('❓ Showing question for:', checkpoint.name);
            
            document.getElementById('question-text').textContent = checkpoint.question;
            
            const buttonContainer = document.getElementById('answer-buttons');
            buttonContainer.innerHTML = '';
            
            checkpoint.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.textContent = answer;
                button.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(button);
            });
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '';
            feedback.style.background = '';
            feedback.style.color = '';
            feedback.style.border = '';
            
            showOverlay('question-overlay');
        }
        
        function checkAnswer(answerIndex) {
            const checkpoint = GAME_CONFIG.checkpoints[currentCheckpointIndex];
            const feedback = document.getElementById('feedback');
            const buttons = document.querySelectorAll('.answer-btn');
            
            buttons.forEach(btn => btn.disabled = true);
            
            if (answerIndex === checkpoint.correctAnswerIndex) {
                feedback.textContent = '✓ Correct! Well done!';
                feedback.style.background = GAME_CONFIG.behavior.correctAnswerBg;
                feedback.style.color = GAME_CONFIG.behavior.correctAnswerText;
                feedback.style.border = `2px solid ${GAME_CONFIG.behavior.correctAnswerText}`;
                
                console.log('✓ Correct answer! Moving to next checkpoint...');
                
                setTimeout(() => {
                    hideOverlay('question-overlay');
                    currentCheckpointIndex++;
                    startNavigationToCheckpoint();
                }, GAME_CONFIG.behavior.correctAnswerDelay);
                
            } else {
                let feedbackText = '✗ Incorrect. Please try again.';
                if (checkpoint.hint) {
                    feedbackText += `\n\nHint: ${checkpoint.hint}`;
                }
                
                feedback.textContent = feedbackText;
                feedback.style.background = GAME_CONFIG.behavior.incorrectAnswerBg;
                feedback.style.color = GAME_CONFIG.behavior.incorrectAnswerText;
                feedback.style.border = `2px solid ${GAME_CONFIG.behavior.incorrectAnswerText}`;
                
                console.log('✗ Incorrect answer, allowing retry...');
                
                setTimeout(() => {
                    feedback.textContent = '';
                    feedback.style.background = '';
                    feedback.style.color = '';
                    feedback.style.border = '';
                    buttons.forEach(btn => btn.disabled = false);
                }, GAME_CONFIG.behavior.incorrectAnswerDelay);
            }
        }
        
        // ============================================
        // GAME COMPLETION
        // ============================================
        function gameComplete() {
            gameState = 'complete';
            hideAllOverlays();
            document.getElementById('arrow-container').style.display = 'none';
            
            showStatusPanel();
            document.getElementById('checkpoint-name').textContent = GAME_CONFIG.general.completionTitle;
            document.getElementById('distance-display').textContent = '';
            document.getElementById('instruction-text').textContent = GAME_CONFIG.general.completionMessage;
            
            const btn = document.getElementById('main-action-btn');
            btn.textContent = 'Restart Game';
            btn.onclick = () => location.reload();
            
            console.log('🎉 Game completed!');
        }
        
        // ============================================
        // DEBUG PANEL UPDATE
        // ============================================
        function updateDebugPanel() {
            if (!GAME_CONFIG.behavior.showDebugPanel) {
                document.getElementById('debug-compass').style.display = 'none';
                return;
            }
            
            const debugPanel = document.getElementById('debug-compass');
            if (gameState === 'navigating' && debugPanel) {
                debugPanel.style.display = 'block';
                document.getElementById('debug-heading').textContent = Math.round(deviceHeading);
                document.getElementById('debug-count').textContent = compassUpdateCount;
                document.getElementById('debug-state').textContent = gameState;
            } else if (debugPanel) {
                debugPanel.style.display = 'none';
            }
        }
        
        setInterval(updateDebugPanel, 200);
        
        // ============================================
        // UI HELPER FUNCTIONS
        // ============================================
        function showStatusPanel() {
            document.getElementById('status-panel').classList.remove('hidden');
        }
        
        function hideStatusPanel() {
            document.getElementById('status-panel').classList.add('hidden');
        }
        
        function showOverlay(overlayId) {
            document.getElementById(overlayId).classList.remove('hidden');
        }
        
        function hideOverlay(overlayId) {
            document.getElementById(overlayId).classList.add('hidden');
        }
        
        function hideAllOverlays() {
            const overlays = document.querySelectorAll('.overlay');
            overlays.forEach(overlay => {
                if (overlay.id !== 'welcome-screen') {
                    overlay.classList.add('hidden');
                }
            });
        }
        
        // ============================================
        // CLEANUP
        // ============================================
        window.addEventListener('beforeunload', () => {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            stopScanning();
        });
        
        // ============================================
        // INITIALIZE ON LOAD
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            applyConfiguration();
            console.log('🎮 HKBU Li Promenade AR Game v2.4 with custom measurements initialized!');
            console.log('📱 Please ensure you allow Motion & Orientation permissions');
        });
    </script>
</body>
</html>
